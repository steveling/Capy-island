<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ff8cc6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Capy Island</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/gate.css">
<script src="js/config.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js" async></script>
</head>
<body>
<canvas id="c"></canvas>
<div id="top"><div class="pill" id="coins">🪙 0</div><div class="pill" id="daypill">☀️ Day 1</div></div>
<div id="bottom">
  <button id="bBag">🎒<span>Bag</span></button>
  <button id="bBook">📖<span>Book</span></button>
  <button id="bHome">🏠<span>Home</span></button>
  <button id="bEmo" class="hidden">😊<span>Emote</span></button>
  <button id="bChat" class="hidden" aria-label="Chat">💬<span>Chat</span><b class="badge hidden"></b></button>
  <button id="bLeave" class="hidden">✈️<span>Leave</span></button>
</div>
<div class="pill hidden" id="mppill"></div>
<button id="gear" aria-label="Grown-ups (press and hold)">⚙️</button>
<button id="who" class="hidden" aria-label="Switch player"></button>
<div id="emobar" class="hidden"></div>
<div id="chat" class="hidden" role="dialog" aria-label="Chat with best friends"><div class="chathead">💬 Best friends chat<button id="chatx" aria-label="Close chat">✕</button></div><div id="chatlog" aria-live="polite"></div><div class="chatrow"><input id="chatin" maxlength="60" autocomplete="off" enterkeyhint="send" placeholder="Say something nice!" aria-label="Chat message"><button id="chatsend" class="btn">Send</button></div><p id="chatnote"></p></div>
<div id="toast"></div>
<div id="talk" class="hidden"><div class="tn"></div><div class="tt"></div><div class="th"></div><div class="row"></div></div>
<div id="fish" class="hidden"><div id="fwater"><div id="ripple"></div><svg id="rod" aria-hidden="true"><path id="rodline"/><path id="rodpole"/><path id="rodhandle"/><circle id="rodreel" r="9"/></svg><div id="bobber">🔴</div></div><div id="fmsg"></div><button class="btn" id="fbtn">Reel in!</button><button class="btn white" id="fcancel">Stop fishing</button></div>
<div id="house" class="hidden"><h2 id="htitle">My House</h2><div class="hint">Tap a square to put furniture there. Tap furniture to put it away.</div><div id="room"><div id="wall">🪟<button id="mirbtn" aria-label="Mirror" onclick="openMirror()">🪞</button>🪟</div><div id="floor"></div></div><div id="score"></div><div class="row"><button class="btn white mirror" onclick="openMirror()">🪞 Mirror</button><button class="btn" id="hexit">Go outside 🌳</button></div></div>
<div id="museum" class="hidden"></div>
<div id="modal" class="hidden"><div class="card" id="card"></div></div>
<div id="quit" class="hidden" role="alertdialog" aria-label="Leave Capy Island?"><div class="card"><h2>🏝️ Leave Capy Island?</h2><div style="text-align:center;font-size:54px">🥺</div><p class="c" style="font-size:17px">Your island is saved.<br>Come back soon!</p><div class="row"><button class="btn" onclick="quitStay()">Keep playing! 🩷</button><button class="btn white" onclick="quitLeave()">Leave 👋</button></div></div></div>
<script src="js/core.js"></script>
<script src="js/sound.js"></script>
<script src="js/data.js"></script>
<script src="js/save.js"></script>
<script src="js/players.js"></script>
<script src="js/world.js"></script>
<script src="js/input.js"></script>
<script src="js/actions.js"></script>
<script src="js/modals.js"></script>
<script src="js/draw.js"></script>
<script src="js/render.js"></script>
<script src="js/multiplayer.js"></script>
<script src="js/places.js"></script>
<script src="js/museum.js"></script>
<script src="js/grownups.js"></script>
<script src="js/cloud.js"></script>
<script src="js/chat.js"></script>
<script src="js/gate.js"></script>
<script src="js/main.js"></script>
</body>
</html>
