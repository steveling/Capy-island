 if(t.until>Date.now())pwLock(t)}

function addItem(id,n=1){if(ITEMS[id].k==='tool'){const f=!S.found[id];S.bag[id]=1;S.found[id]=1;return f}S.bag[id]=(S.bag[id]||0)+n;if(ITEMS[id].k==='fruit')for(let i=0;i<n;i++)S.stack.push(id);const first=!S.found[id];S.found[id]=1;return first}
function takeItem(id,n=1){if((S.bag[id]||0)<n)return false;if(ITEMS[id].k==='fruit')for(let i=0;i<n;i++){const j=S.stack.lastIndexOf(id);if(j>=0)S.stack.splice(j,1)}S.bag[id]-=n;if(S.bag[id]<=0)delete S.bag[id];return true}

const SND={yay:()=>beep([[660,.12],[880,.12],[1175,.25]]),pop:()=>beep([[520,.08],[780,.12]]),oops:()=>beep([[400,.15],[300,.25]]),coin:()=>beep([[988,.08],[1319,.2]])};

// ---------- DAYS ----------
function todayKey(){const d=new Date();return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()}
function beachAngle(){let a;for(let i=0;i<30;i++){a=rnd(0,Math.PI*2);const d=Math.abs(((a-DA)%(Math.PI*2)+Math.PI*3)%(Math.PI*2)-Math.PI);if(d>.38&&POOLS.every(p=>Math.abs(((a-p.a)%(Math.PI*2)+Math.PI*3)%(Math.PI*2)-Math.PI)>.16)&&Math.abs(((a-STALL.a)%(Math.PI*2)+Math.PI*3)%(Math.PI*2)-Math.PI)>.22)break}return a}
function randomReq(){const r=Math.random();if(r<.5)return pick(['orange','yuzu']);if(r<.75)return pick(['butterfly','ladybug','caterpillar','snail','ant','cricket','bee']);return pick(['fish','tropical','crab','shrimp'])}
function newDay(force){if(VIS())return false;const k=todayKey();if(!force&&S.dayKey===k)return false;let missed=1;if(S.dayKey&&!force)missed=Math.max(1,Math.round((new Date(k)-new Date(S.dayKey))/864e5));
 const prevDay=S.day;S.dayKey=k;S.day++;S.trees=TREES.map(()=>3);S.yuzu=0;
 NEIGH.forEach(n=>{const s=S.neigh[n.id];s.req=randomReq();s.done=false;s.talked=false});
 const pool=BUYABLE.slice().sort(()=>Math.random()-.5);S.stock=pool.slice(0,4);
 const add=Math.min(3-S.presents.length,Math.min(missed,3));for(let i=0;i<add;i++)S.presents.push(beachAngle());
 // presents friends left while visiting yesterday arrive on the beach today
 if(S.giftsPending.length){S.giftsPending.forEach(g=>S.fpresents.push({a:beachAngle(),from:g.from,c:g.c,item:g.item}));S.giftsPending=[];S.fpresents=S.fpresents.slice(-12)}
 dayV4(prevDay);bugs=[];for(let i=0;i<4;i++)spawnBug();save();newsToast();return true}

function grassSpot(){for(let i=0;i<50;i++){const x=rnd(180,1220),y=rnd(170,960);if(norm(x,y,GRX,GRY)<.85&&dist(x,y,HOUSE.x,HOUSE.y-40)>90&&dist(x,y,SHOP.x,SHOP.y-40)>90&&dist(x,y,SPRING.x,SPRING.y)>110&&grassFree(x,y))return{x,y}}return{x:700,y:600}}
function spawnBug(){const t=weighted('bug'),p=grassSpot();bugs.push({t,x:p.x,y:p.y,vx:0,vy:0,ch:0,flee:0,ph:rnd(0,6)})}

// ---------- INPUT ----------
const cam={x:P.x,y:P.y};
function toWorld(sx,sy){return{x:(sx-W/2)/SCALE+cam.x,y:(sy-H/2)/SCALE+cam.y}}
cv.addEventListener('pointerdown',ev=>{if(busy)return;$('#emobar').classList.add('hidden');if(talking){closeTalk();}if(P.soak)leaveSpring();const w=toWorld(ev.clientX,ev.clientY);tapWorld(w.x,w.y)});
function dockHit(x,y){return dist(x,y,SIGN.x,SIGN.y-30)<42||(Math.abs(x-PIER.x)<26&&y>PIER.y-14&&y<PIER.y+PIER.len)||(Math.abs(x-PLANE.x)<62&&Math.abs(y-(PLANE.y-26))<36)}
function tapWorld(x,y){
 if(tapSky(x,y))return;
 for(const b of bugs)if(dist(x,y,b.x,b.y-10)<34){P.act={k:'bug',b};return}
 const pl=presList();for(let i=0;i<pl.length;i++){const p=posAt(pl[i]);if(dist(x,y,p.x,p.y-12)<34){P.act={k:'present',i};setT(p.x,p.y+8);return}}
 const fl=fpList();for(let i=0;i<fl.length;i++){const p=posAt(fl[i].a);if(dist(x,y,p.x,p.y-12)<34){P.act={k:'fpresent',i};setT(p.x,p.y+8);return}}
 for(const n of NEIGH)if(dist(x,y,n.x,n.y-22)<38){P.act={k:'talk',n};return}
 if(tapV4(x,y))return;
 if(dockHit(x,y)){P.act={k:'dock'};setT(DOCK.x,DOCK.y);return}
 {const sx=(x-SPRING.x)/(SPRING.rx+30),sy=(y-SPRING.y)/(SPRING.ry+26);if(sx*sx+sy*sy<1){P.act={k:'spring'};setT(SPRING.x-SPRING.rx-16,SPRING.y+6);return}}
 for(let i=0;i<TREES.length;i++){const t=TREES[i];if(dist(x,y,t.x,t.y-58)<48||dist(x,y,t.x,t.y-15)<22){P.act={k:'tree',i};setT(t.x+(P.x<t.x?-34:34),t.y+6);return}}
 if(Math.abs(x-HOUSE.x)<66&&y<HOUSE.y+6&&y>HOUSE.y-135){P.act={k:'house'};setT(HOUSE.x,HOUSE.y+22);return}
 if(Math.abs(x-SHOP.x)<66&&y<SHOP.y+6&&y>SHOP.y-130){P.act={k:'shop'};setT(SHOP.x,SHOP.y+22);return}
 if(norm(x,y,SRX,SRY)>1){const e=edge(angleOf(x,y),SRX,SRY,.94);P.act={k:'fish'};setT(e.x,e.y);return}
 P.act=null;setT(x,y)}
function setT(x,y){if(norm(x,y,SRX,SRY)>.95){const e=edge(angleOf(x,y),SRX,SRY,.95);x=e.x;y=e.y}P.tx=x;P.ty=y}
function posAt(a){return edge(a,(SRX+GRX)/2+6,(SRY+GRY)/2+6,1)}
function presentPos(i){return posAt(S.presents[i])}

// ---------- UPDATE ----------
function update(dt){time+=dt;
 const a=P.act;
 if(a&&a.k==='bug'){if(!bugs.includes(a.b)){P.act=null}else{P.tx=a.b.x+(P.x<a.b.x?-26:26);P.ty=a.b.y+4;if(dist(P.x,P.y,a.b.x,a.b.y)<48){catchBug(a.b);P.act=null}}}
 else if(a&&a.k==='talk'){P.tx=a.n.x+(P.x<a.n.x?-46:46);P.ty=a.n.y+2;if(dist(P.x,P.y,a.n.x,a.n.y)<58){P.act=null;P.tx=P.x;P.ty=P.y;openTalk(a.n)}}
 const dx=P.tx-P.x,dy=P.ty-P.y,d=Math.hypot(dx,dy),sp=175*spdMul();
 if(d>3){const s=Math.min(d,sp*dt);P.x+=dx/d*s;P.y+=dy/d*s;P.walk+=dt*12;P.moving=true;if(Math.abs(dx)>2)P.face=dx>0?1:-1}
 else{P.moving=false;if(a&&!['bug','talk'].includes(a.k)){P.act=null;doAct(a)}}
 const vis=ONV();
 NEIGH.forEach((n,i)=>{if(vis&&!MP.offline){const k=Math.min(1,dt*8);n.x+=(n.tx-n.x)*k;n.y+=(n.ty-n.y)*k;return}
  if(talking===n){n.face=P.x>n.x?1:-1;return}const joins=!vis&&P.soak&&S.neigh[n.id].f>=3;
  if(joins){n.tx=SOAK[i].x;n.ty=SOAK[i].y}else if(n.soak){n.soak=false;n.tx=n.hx;n.ty=n.hy;n.wait=rnd(1,3)}
  const ddx=n.tx-n.x,ddy=n.ty-n.y,dd=Math.hypot(ddx,ddy);if(dd>2){const s=Math.min(dd,(joins?70:n.hi?160:38)*dt);n.x+=ddx/dd*s;n.y+=ddy/dd*s;if(Math.abs(ddx)>1)n.face=ddx>0?1:-1}else if(joins){n.soak=true;n.face=-1}else if(n.hi){n.hi=false;n.face=P.x>n.x?1:-1}else if((n.wait-=dt)<0){n.wait=rnd(2,6);n.tx=n.hx+rnd(-80,80);n.ty=n.hy+rnd(-50,50)}});
 if(!vis&&!VIS()&&P.soak&&S.soakDay!==S.dayKey){const want=NEIGH.filter(n=>S.neigh[n.id].f>=3),inn=want.filter(n=>n.soak);if(want.length&&inn.length===want.length){S.soakDay=S.dayKey;inn.forEach(n=>friend(n,1));SND.yay();openSpring(`Ahhh... ♨️ ${inn.map(n=>n.n).join(' and ')} came to soak with you! 💕 What a happy day!`);save()}}
 bugs.forEach(b=>{const it=ITEMS[b.t];b.ph+=dt;if((b.ch-=dt)<0){b.ch=rnd(1,3);const sp=it.fly?40:12,ang=rnd(0,6.28);b.vx=Math.cos(ang)*sp;b.vy=Math.sin(ang)*sp}
  if(b.flee>0){b.flee-=dt;const ex=b.x-P.x,ey=b.y-P.y,el=Math.hypot(ex,ey)||1;b.vx=ex/el*110;b.vy=ey/el*110}
  const nx=b.x+b.vx*dt,ny=b.y+b.vy*dt;if(norm(nx,ny,GRX,GRY)<.9){b.x=nx;b.y=ny}else{b.vx*=-1;b.vy*=-1}});
 if(!VIS()&&(bugTimer-=dt)<0){bugTimer=10;if(bugs.length<5)spawnBug()}
 updV4(dt);
 TREES.forEach(t=>t.shake=Math.max(0,t.shake-dt));
 parts=parts.filter(p=>(p.life-=dt)>0);parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.fl?-6:260)*dt});
 mpUpdate(dt);
 cam.x+=(P.x-cam.x)*Math.min(1,dt*6);cam.y+=(P.y-40+(talking?120/SCALE:0)-cam.y)*Math.min(1,dt*6);
 const hw=W/2/SCALE,hh=H/2/SCALE;cam.x=Math.max(hw-60,Math.min(1460-hw,cam.x));cam.y=Math.max(hh-60,Math.min(1180-hh,cam.y));
}

// ---------- ACTIONS ----------
function hostName(){return esc(MP.island?MP.island.name:'')}
function doAct(a){const vis=ONV();if(actV4(a))return;
 if(a.k==='tree'){const t=TREES[a.i];t.shake=.6;if(vis){toast(`Those are ${hostName()}'s ${t.f==='orange'?'oranges':'yuzu'}! ${ITEMS[t.f].e}<br>You can pick fruit on your own island.`);return}
  const n=S.trees[a.i];if(n>0){S.trees[a.i]=0;const first=addItem(t.f,n);burst(t.x,t.y-60,ITEMS[t.f].e,n+2);SND.pop();const h=S.stack.length;toast(`You picked ${n} ${ITEMS[t.f].n}! ${ITEMS[t.f].e}`+(first?'<br>✨ New in your book!':'')+(h>=12?`<br>WOW! ${h} fruit on your head! 🤣`:h>=6?`<br>You're balancing ${h} fruit on your head! 😆`:''));save()}else toast('No fruit left. It will grow back tomorrow! 🌙')}
 else if(a.k==='present'){if(vis){toast(`That present is for ${hostName()}! 🎁`);return}if(a.i>=S.presents.length)return;const p=presentPos(a.i);S.presents.splice(a.i,1);openPresent(p);save()}
 else if(a.k==='fpresent'){if(vis){toast(`That present is for ${hostName()}! 💝`);return}openFPresent(a.i)}
 else if(a.k==='house'){if(vis){toast(`That's ${hostName()}'s house! 🏠`);return}openHouse()}
 else if(a.k==='shop'){if(vis){toast('Berry says: "Come shopping on your own island!" 🦝');return}openShop()}
 else if(a.k==='fish'){if(vis){toast('No fishing on a visit.<br>You can fish at home! 🎣');return}startFish()}
 else if(a.k==='spring')enterSpring();
 else if(a.k==='dock')openDock();

function ell(x,y,rx,ry,c){ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}

function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}

function shade(hex,f){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;if(f>0){r+=(255-r)*f;g+=(255-g)*f;b+=(255-b)*f}else{r*=1+f;g*=1+f;b*=1+f}return`rgb(${r|0},${g|0},${b|0})`}

const SHADOW=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d'),r=g.createRadialGradient(32,32,0,32,32,32);r.addColorStop(0,'rgba(80,30,70,.40)');r.addColorStop(.5,'rgba(80,30,70,.26)');r.addColorStop(1,'rgba(80,30,70,0)');g.fillStyle=r;g.fillRect(0,0,64,64);return c})();

function emoji(e,x,y,s,f){const k=e+'|'+s+'|'+(f||'');let c=EC.get(k);if(!c){if(EC.size>500)EC.clear();const px=Math.ceil(s*1.3*ER);c=document.createElement('canvas');c.width=c.height=px;const g=c.getContext('2d',{willReadFrequently:!!f});g.font=`${s*ER}px ${EMO}`;g.textAlign='center';g.textBaseline='middle';g.fillStyle='#000';g.fillText(e,px/2,px/2);if(f)fxPx(g,px,f);EC.set(k,c)}const d=s*1.3;ctx.drawImage(c,x-d/2,y-d/2,d,d)}

const IB={x:-20,y:0,w:1440,h:1170};let ISL_CV=null,ISL_K=0;

function paintIsland(){let s=11;const r=()=>(s=(s*16807)%2147483647)/2147483647;
 // shallow water around the island
 [[1.2,'rgba(200,250,255,.16)'],[1.12,'rgba(200,250,255,.2)'],[1.06,'rgba(215,252,255,.28)']].forEach(([k,c])=>{ctx.fillStyle=c;islandPath(SRX,SRY,k,12);ctx.fill()});
 // cliff: the island is a raised landmass (sand layers visible on the south side)
 ctx.fillStyle='#a57c4f';islandPath(SRX,SRY,1,27);ctx.fill();
 const cg=ctx.createLinearGradient(0,CY+150,0,CY+SRY+30);cg.addColorStop(0,'#e3bf86');cg.addColorStop(1,'#c39862');ctx.fillStyle=cg;islandPath(SRX,SRY,1,22);ctx.fill();
 ctx.fillStyle='rgba(255,240,210,.35)';islandPath(SRX,SRY,1,10);ctx.fill();

// A private Realtime channel wrapped to look like a PeerJS DataConnection (on/send/close/open/peer),
// so the existing host/visitor code runs unchanged over Supabase.
class CloudConn{constructor(topic,peer){this.peer=peer;this.cloud=true;this.open=false;this.closed=false;this.h={};this.last={};this.lastT={};
  const ch=CL.sb.channel(topic,{config:{private:true,broadcast:{self:false}}});this.ch=ch;
  ch.on('broadcast',{event:'m'},m=>{if(this.open&&m&&m.payload&&typeof m.payload==='object')this.emit('data',m.payload)});
  ch.subscribe((st,err)=>{if(this.ch!==ch)return;if(st==='SUBSCRIBED'){if(!this.open&&!this.closed){this.open=true;this.emit('open')}}
   else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'||st==='CLOSED'){const was=this.open;this.open=false;if(!this.closed){this.closed=true;this.ch=null;try{CL.sb.removeChannel(ch)}catch(e){}this.emit(was?'close':'error',err)}}})}
 on(ev,f){(this.h[ev]=this.h[ev]||[]).push(f);return this}
 emit(ev,a){(this.h[ev]||[]).slice().forEach(f=>{try{f(a)}catch(e){console.error(e)}})}
 // position packets: max ~6/s, and none while nothing moves (2s keep-alive) => about half the Realtime quota of 12/s
 send(m){if(!this.open||!this.ch)return;if(m&&(m.t==='p'||m.t==='ps')){const j=JSON.stringify(m),now=performance.now(),dt=now-(this.lastT[m.t]||0);if(dt<2000&&(j===this.last[m.t]||dt<150))return;this.last[m.t]=j;this.lastT[m.t]=now}
  this.ch.send({type:'broadcast',event:'m',payload:m}).catch(()=>{})}
 close(){if(this.closed)return;const was=this.open;this.open=false;this.closed=true;const ch=this.ch;this.ch=null;if(ch)setTimeout(()=>{try{CL.sb.removeChannel(ch)}catch(e){}},250);if(was)this.emit('close')}}

function clLobbyStart(){if(!CL.ready||CL.lobby)return;const ch=CL.sb.channel('island:'+CL.uid,{config:{private:true,broadcast:{self:false},presence:{key:'host',enabled:true}}});CL.lobby=ch;CL.lobbyOk=false;CL.tracked='';
 ch.on('broadcast',{event:'knock'},m=>clKnock(m&&m.payload));
 ch.subscribe(st=>{if(CL.lobby!==ch)return;if(st==='SUBSCRIBED'){CL.lobbyOk=true;CL.tracked='';clTrack()}
  else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'){CL.lobbyOk=false;CL.lobby=null;try{CL.sb.removeChannel(ch)}catch(e){}clearTimeout(CL.lobT);CL.lobT=setTimeout(clLobbyStart,20000)}})}
function clTrack(){if(!CL.lobby||!CL.lobbyOk)return;const away=MP.role==='visitor'||MP.role==='connecting'||document.hidden;
 const want=!away&&(CL.dropins||(MP.role==='host'&&!!MP.code))?(MP.role==='host'&&MP.vis.size>=MAX_VIS?'full':'on'):'';if(want===CL.tracked)return;CL.tracked=want;
 try{(want?CL.lobby.track({h:1,full:want==='full'?1:0}):CL.lobby.untrack()).catch(()=>{})}catch(e){}}
function clKnock(p){const vid=String(p&&p.from||'');if(!UUID_RE.test(vid)||vid===CL.uid||!CL.ready)return;
 if(MP.role==='visitor'||MP.role==='connecting'||document.hidden)return;
 if(!(CL.dropins||(MP.role==='host'&&MP.hostState==='open')))return;
 if(CL.pipes.has(vid)||CL.pipes.size>=6)return;
 // one private pipe per visitor: visit:<me>:<visitor>; Realtime RLS only lets the two of them in, and only if friends
 const conn=new CloudConn('visit:'+CL.uid+':'+vid,vid);CL.pipes.set(vid,conn);
 const gone=()=>{if(CL.pipes.get(vid)===conn)CL.pipes.delete(vid)};conn.on('close',gone);conn.on('error',gone);
 conn.on('data',d=>{if(d&&d.t==='hello'&&!MP.role&&!document.hidden&&CL.ready){MP.role='host';MP.hostState='open';MP.code=null;MP.dropin=true;MP.vis.clear();MP.players.clear();MP.emo.clear();MP.islJ='';MP.dirty=false}});
 conn.on('open',()=>{hostConn(conn);setTimeout(()=>{if(!MP.vis.has(vid)&&CL.pipes.get(vid)===conn){conn.close();clDropinEnd();mpUI()}},12000)})}
function clDropinEnd(){if(MP.role==='host'&&MP.dropin&&!MP.vis.size){MP.role=null;MP.hostState=null;MP.dropin=false;MP.players.clear();MP.emo.clear()}}

async function clFlyTo(fid,nm){const going=()=>MP.role==='connecting';
 // 1) is the friend playing? (their presence on island:<friend>)
 const lobby=CL.sb.channel('island:'+fid,{config:{private:true,broadcast:{self:false},presence:{key:CL.uid,enabled:true}}});MP.clLobby=lobby;

 const online=await new Promise(res=>{let done=false;const fin=v=>{if(!done){done=true;clearTimeout(t);res(v)}},t=setTimeout(()=>fin(hostState()),9000);
  lobby.on('presence',{event:'sync'},()=>{const h=hostState();if(h)fin(h)});

 conn.on('close',()=>{if(MP.conn!==conn)return;if(MP.role==='visitor')returnHome('lost');else toSnap()});

 conn.on('open',()=>{let n=0;const knock=()=>{if(MP.conn!==conn||!going())return;try{lobby.send({type:'broadcast',event:'knock',payload:{from:CL.uid}}).catch(()=>{})}catch(e){}
  conn.send({t:'hello',v:1,name:S.name||'Friend',color:myColor(),acc:myAcc(),stack:S.stack.slice(0,15)});if(++n<8)MP.clT=setTimeout(knock,1500)};knock()});

#gate .gbub{position:relative;background:#fff;border:3px solid #ff8cc6;border-radius:22px;padding:12px 16px;font-size:19px;font-weight:800;text-align:center;box-shadow:0 4px 0 #e56aa8;min-height:64px;line-height:1.35}
#gate .gbub:after{content:'';position:absolute;left:50%;bottom:-19px;margin-left:-11px;border:11px solid transparent;border-top-color:#ff8cc6}
#gate .gbub b{color:#d94b90}
#gate .gstage{position:relative;height:190px;margin-top:16px}
#gate .gguard{position:absolute;left:50%;bottom:0;width:150px;margin-left:-118px}
#gate .gguard svg{width:150px;height:161px;display:block;animation:gbob 2.6s ease-in-out infinite;transform-origin:50% 100%}
@keyframes gbob{50%{transform:translateY(-4px) scaleY(1.015)}}
#gate #ghead{transform-origin:80px 96px}#gate #garm{transform-origin:122px 100px}
#gate .no #ghead{animation:gshake .55s ease-in-out 2}
@keyframes gshake{20%{transform:rotate(-11deg)}60%{transform:rotate(11deg)}}
#gate .yes #garm{animation:gwave .38s ease-in-out 6 alternate}
@keyframes gwave{to{transform:rotate(-72deg)}}
#gate .gpost{position:absolute;left:50%;bottom:0;margin-left:34px;width:16px;height:92px;border-radius:6px;background:#35437d}
#gate .gbar{position:absolute;left:50%;bottom:74px;margin-left:44px;width:118px;height:14px;border-radius:7px;background:repeating-linear-gradient(90deg,#ff5fa2 0 16px,#fff 16px 32px);border:2px solid #d94b90;transform-origin:4px 50%;transition:transform .7s cubic-bezier(.3,1.5,.5,1)}
#gate .gstage.open .gbar{transform:rotate(-78deg)}
#gate .gform{background:#fffffff0;border:3px solid #ffd0e6;border-radius:22px;padding:12px;margin-top:10px;box-shadow:0 5px 0 #f3b5d3}
#gate input.name{font-size:26px;text-align:center;letter-spacing:2px;margin:0 0 10px;user-select:text;-webkit-user-select:text}
#gate .btn.big{width:100%;font-size:23px}
#gate .gnote{text-align:center;font-weight:800;font-size:14px;margin:10px 0 0;min-height:1em}
#gate .glink{display:block;margin:12px auto 0;background:none;border:none;color:#b0487c;font:inherit;font-weight:800;font-size:14px;text-decoration:underline;cursor:pointer;width:auto}
#gate .gform.shake{animation:gnudge .4s ease 1}
@keyframes gnudge{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}`;
function gateSay(h){const b=$('#gbub');if(b)b.innerHTML=h}
function gateNote(h){const n=$('#gnote');if(n)n.innerHTML=h||''}
function gateNet(){if(!$('#gate'))return;gateNote(navigator.onLine?'':"📡 No internet right now. The very first time, this phone needs the internet so I can check the secret word.")}
function showGate(){if(!document.getElementById('gstyle')){const st=document.createElement('style');st.id='gstyle';st.textContent=GATE_CSS;document.head.appendChild(st)}
 if($('#gate'))return;closeModal();const g=document.createElement('div');g.id='gate';g.setAttribute('role','dialog');g.setAttribute('aria-label','Secret island code');
 g.innerHTML=`<div class="gsky"><div class="gcl" style="top:7%;width:70px"></div><div class="gcl" style="top:21%;width:54px;animation-delay:-14s"></div><div class="gcl" style="top:33%;width:80px;animation-delay:-27s"></div><div class="gpl">🛩️</div><div class="grun"></div></div>
 <div class="gsign">✈️ CAPY AIR · ARRIVALS<small>Gate 🏝️ Capy Island</small></div>
 <div class="gbub" id="gbub">Welcome, traveler! 🧳<br><b>What's the secret word?</b></div>
 <div class="gstage" id="gstage"><div class="gpost"></div><div class="gbar"></div><div class="gguard" id="gguard">${GUARD_SVG}</div></div>
 <div class="gform" id="gform"><div id="gmain"><input class="name" id="gin" maxlength="40" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="secret island code" aria-label="Enter the secret island code">
 <button class="btn big" id="gbtn">Let me in! ✈️</button></div><p class="gnote" id="gnote"></p>
 <button class="glink" id="gmove">📲 Moving from another phone?</button></div>`;
 document.body.appendChild(g);gateNet();
 $('#gbtn').onclick=gateTry;$('#gin').onkeydown=e=>{if(e.key==='Enter')gateTry()};$('#gmove').onclick=gateMoveForm;
 setTimeout(()=>{const i=$('#gin');if(i)try{i.focus({preventScroll:true})}catch(e){}},400)}
addEventListener('online',gateNet);addEventListener('offline',gateNet);
let gateBusy=false;
function gateMood(k){const gd=$('#gguard');if(!gd)return;gd.classList.remove('no','yes');void gd.offsetWidth;if(k)gd.classList.add(k)}
async function gateTry(){if(gateBusy)return;const i=$('#gin'),v=(i&&i.value||'').trim();
 if(!v){gateSay('Type the secret word in the box! 😊');return}
 if(!navigator.onLine){gateSay("📡 Oh no, I can't check it without the internet!");gateNet();return}
 gateBusy=true;const b=$('#gbtn');b.disabled=true;b.textContent='Checking... 🔍';gateNote('');
 let ok=false,err='';try{await clAuth();ok=await clRpc('redeem_passcode',{p:v})===true}catch(e){err=clErr(e)||'net'}
 gateBusy=false;if(!$('#gate'))return;b.disabled=false;b.textContent='Let me in! ✈️';
 if(ok){try{localStorage.setItem(UNLOCK_KEY,'1')}catch(e){}gateWin();return}
 if(err){gateMood('no');if(err.includes('rate_limited'))gateSay("Phew, that's a lot of tries! 😅<br>Let's take a little break and try again later.");
  else gateSay("📡 Hmm, my radio can't reach the island right now.<br>Check the internet and try again!");return}
 gateMood('no');try{SND.pop()}catch(e){}const f=$('#gform');f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake');
 gateSay("Hmm, that's not it! 🙈<br><b>Ask a grown-up</b> for the secret word.");i.value='';i.focus()}
function gateWin(){gateMood('yes');const st=$('#gstage');st.classList.add('open');try{SND.yay();setTimeout(()=>SND.yay(),400)}catch(e){}
 gateSay('🎉 Yay! That\'s it! 🎉<br><b>Welcome to Capy Island!</b> Come on through! 👋');const f=$('#gform');if(f)f.style.visibility='hidden';
 const c=document.createElement('div');c.className='confetti';c.style.cssText='position:fixed;left:0;right:0;top:30%;z-index:61';
 c.innerHTML=Array.from({length:28},(_,k)=>`<i style="left:${(k*37)%100}%;animation-delay:${(k%7)*.09}s;background:${['#ff8cc6','#ffd84d','#8fd3f0','#b48cff','#5fd3a8'][k%5]}"></i>`).join('');$('#gate').appendChild(c);
 setTimeout(()=>{const g=$('#gate');if(!g)return;g.classList.add('bye');setTimeout(()=>{g.remove();gateDone()},650)},2300)}
function gateDone(){if(!CL.booted){CL.booted=true;capyBoot()}if(!CL.started){CL.started=true;clStart()}else{CL.status='off';clInit()}}
// a phone that is moving over from an allowed phone: the one-time moving code also unlocks it (server-side in claim_transfer)
function gateMoveForm(){const m=$('#gmain');if(!m)return;gateSay('Moving from another phone? 📲<br><b>Type the moving code</b> from the old phone!');gateNote('');
 m.innerHTML='<input class="name" id="gin" maxlength="16" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX-XXXX" style="font-size:22px"><button class="btn big" id="gbtn">Move my island here 🛩️</button>';
 $('#gbtn').onclick=gateMove;$('#gmove').textContent='🔑 I have the secret word instead';$('#gmove').onclick=()=>{$('#gate').remove();showGate()}}
async function gateMove(){if(gateBusy)return;const c=String($('#gin').value||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
 if(c.length!==12){gateSay('Moving codes look like<br><b>XXXX-XXXX-XXXX</b> 🙂');return}
 if(!navigator.onLine){gateSay("📡 I need the internet to bring your island over!");return}
 gateBusy=true;const b=$('#gbtn');b.disabled=true;b.textContent='Moving... 🛩️';let r=null,err='';
 try{await clAuth();r=await clRpc('claim_transfer',{p_code:c})}catch(e){err=clErr(e)||'net'}
 gateBusy=false;b.disabled=false;b.textContent='Move my island here 🛩️';
 if(!r||!r.save){gateMood('no');gateSay(err.includes('rate_limited')?"That's a lot of tries! 😅 Let's rest and try later.":err?"📡 I can't reach the island right now. Try again!":"Hmm, that code didn't work. 🙈<br>It may be mistyped, used already, or too old.");return}
 let bk;try{bk=parseBackup(JSON.stringify(r.save))}catch(e){gateSay('😕 The island data looks damaged. Nothing was changed.');return}
 restoring=true;try{localStorage.setItem(KEY,JSON.stringify(bk.save));localStorage.setItem(UNLOCK_KEY,'1')}catch(e){restoring=false;gateSay("😕 Couldn't save on this phone.");return}
 const ts=Number(r.save_ts)||Date.now();clMetaSet({uid:CL.uid,localTs:ts,syncedTs:ts,dirty:false,moved:false,friends:[]});gateWin();setTimeout(()=>location.replace(location.pathname),2400)}

function clStart(){CL.started=true;
 document.addEventListener('visibilitychange',()=>{if(document.hidden){clTrack();clFlush()}else{clTrack();if(CL.ready)clHeartbeat();else clInit()}});
 addEventListener('pagehide',clFlush);addEventListener('online',()=>clInit());
 setInterval(()=>{if(!CL.ready&&!document.hidden&&CL.status!=='moved')clInit()},120000);
 clInit()}

// ---------- START ----------
islReady=true;buildIsland();
const QS=new URLSearchParams(location.search);let pendingVisit=(QS.get('visit')||'').toUpperCase();if(!/^[A-Z0-9]{5}$/.test(pendingVisit)||[...pendingVisit].some(c=>!CODE_ABC.includes(c)))pendingVisit='';
if(QS.has('visit'))try{QS.delete('visit');history.replaceState(null,'',location.pathname+(QS.toString()?'?'+QS:'')+location.hash)}catch(e){}
function maybeVisit(){if(pendingVisit){const c=pendingVisit;pendingVisit='';setTimeout(()=>openDock('visit',c),700)}}
function welcome(){modal(`<h2>🌸 Welcome to Capy Island! 🌸</h2><div style="text-align:center;font-size:54px">🏝️</div><p style="text-align:center;font-weight:700">You're a little pink capybara with your very own island! What's your name?</p><input class="name" id="nm" maxlength="12" value="Emi"><p style="font-size:15px;line-height:1.5">👆 Tap anywhere to walk.<br>🍊 Tap trees to pick fruit. It stacks on your head!<br>🦋 Tap bugs to catch them.<br>🌊 Tap the water to go fishing.<br>🐰 Tap your friends to say hi!<br>♨️ Tap the hot spring to relax.<br>🏛️ Visit the museum and café!<br>✈️ Tap the seaplane to visit friends!</p><div class="row"><button class="btn" id="go">Let's play! 🩷</button></div>${CL.on?'<p class="c" style="font-size:13px;margin:12px 0 0"><a href="#" style="color:#b0487c" onclick="clMoveHere();return false">📱 Moving from another phone? (grown-ups)</a></p>':''}`);
 $('#go').onclick=()=>{S.name=($('#nm').value.trim()||'Emi').slice(0,12);closeModal();newDay(true);hud();save();plSync();
  pwCreate(()=>{toast('Look! There are presents on the beach! 🎁',3500);maybeVisit()})}}
if(QS.has('newday')){S.dayKey='';}
function capyBoot(){CL.booted=true;hud();
if(!S.name)welcome();
else{plSync();if(!plMe().pw)pwCreate(v4news?showNews:null);else if(v4news)showNews();if(newDay()){hud();setTimeout(()=>toast(`Good morning, ${esc(S.name)}! 🌞<br>The fruit grew back and your friends need help!`+(S.fpresents.length?'<br>💝 A friend left you a present on the beach!':''),4000),300)}else{for(let i=0;i<4;i++)spawnBug()}maybeVisit()}}
if(gateOpen())capyBoot();else showGate();
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else if(S.name&&CL.booted&&!VIS()&&newDay()){hud();toast(`Good morning, ${esc(S.name)}! 🌞 A new day on Capy Island!`,3500)}});
addEventListener('pagehide',()=>{if(MP.role==='visitor')try{MP.conn&&MP.conn.send({t:'bye'})}catch(e){}if(MP.role==='host')try{broadcast({t:'closed'})}catch(e){}});
setInterval(save,5000);
requestAnimationFrame(loop);
if(CL.on&&gateOpen())clStart();
</script>
</body>
</html>
