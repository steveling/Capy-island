 ready:false,initing:false,status:'off',err:'',sb:null,uid:null,token:null,meta:{},hash:'',friends:[],frT:0,lobby:null,lobbyOk:false,tracked:'',pipes:new Map(),

function addItem(id,n=1){S.bag[id]=(S.bag[id]||0)+n;if(ITEMS[id].k==='fruit')for(let i=0;i<n;i++)S.stack.push(id);const first=!S.found[id];S.found[id]=1;return first}
function takeItem(id,n=1){if((S.bag[id]||0)<n)return false;if(ITEMS[id].k==='fruit')for(let i=0;i<n;i++){const j=S.stack.lastIndexOf(id);if(j>=0)S.stack.splice(j,1)}S.bag[id]-=n;if(S.bag[id]<=0)delete S.bag[id];return true}

const SND={yay:()=>beep([[660,.12],[880,.12],[1175,.25]]),pop:()=>beep([[520,.08],[780,.12]]),oops:()=>beep([[400,.15],[300,.25]]),coin:()=>beep([[988,.08],[1319,.2]])};

// ---------- DAYS ----------
function todayKey(){const d=new Date();return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()}
function beachAngle(){let a;for(let i=0;i<30;i++){a=rnd(0,Math.PI*2);const d=Math.abs(((a-DA)%(Math.PI*2)+Math.PI*3)%(Math.PI*2)-Math.PI);if(d>.38)break}return a}
function randomReq(){const r=Math.random();if(r<.5)return pick(['orange','yuzu']);if(r<.75)return pick(['butterfly','ladybug','caterpillar','snail','ant','cricket','bee']);return pick(['fish','tropical','crab','shrimp'])}
function newDay(force){if(VIS())return false;const k=todayKey();if(!force&&S.dayKey===k)return false;let missed=1;if(S.dayKey&&!force)missed=Math.max(1,Math.round((new Date(k)-new Date(S.dayKey))/864e5));
 S.dayKey=k;S.day++;S.trees=TREES.map(()=>3);S.yuzu=0;
 NEIGH.forEach(n=>{const s=S.neigh[n.id];s.req=randomReq();s.done=false;s.talked=false});
 const pool=BUYABLE.slice().sort(()=>Math.random()-.5);S.stock=pool.slice(0,4);
 const add=Math.min(3-S.presents.length,Math.min(missed,3));for(let i=0;i<add;i++)S.presents.push(beachAngle());
 // presents friends left while visiting yesterday arrive on the beach today
 if(S.giftsPending.length){S.giftsPending.forEach(g=>S.fpresents.push({a:beachAngle(),from:g.from,c:g.c,item:g.item}));S.giftsPending=[];S.fpresents=S.fpresents.slice(-12)}
 bugs=[];for(let i=0;i<4;i++)spawnBug();save();return true}

function spawnBug(){const t=weighted('bug'),p=grassSpot();bugs.push({t,x:p.x,y:p.y,vx:0,vy:0,ch:0,flee:0,ph:rnd(0,6)})}

// ---------- INPUT ----------

function dockHit(x,y){return dist(x,y,SIGN.x,SIGN.y-30)<42||(Math.abs(x-PIER.x)<26&&y>PIER.y-14&&y<PIER.y+PIER.len)||(Math.abs(x-PLANE.x)<62&&Math.abs(y-(PLANE.y-26))<36)}
function tapWorld(x,y){
 for(const b of bugs)if(dist(x,y,b.x,b.y-10)<34){P.act={k:'bug',b};return}
 const pl=presList();for(let i=0;i<pl.length;i++){const p=posAt(pl[i]);if(dist(x,y,p.x,p.y-12)<34){P.act={k:'present',i};setT(p.x,p.y+8);return}}
 const fl=fpList();for(let i=0;i<fl.length;i++){const p=posAt(fl[i].a);if(dist(x,y,p.x,p.y-12)<34){P.act={k:'fpresent',i};setT(p.x,p.y+8);return}}
 for(const n of NEIGH)if(dist(x,y,n.x,n.y-22)<38){P.act={k:'talk',n};return}
 if(dockHit(x,y)){P.act={k:'dock'};setT(DOCK.x,DOCK.y);return}
 {const sx=(x-SPRING.x)/(SPRING.rx+30),sy=(y-SPRING.y)/(SPRING.ry+26);if(sx*sx+sy*sy<1){P.act={k:'spring'};setT(SPRING.x-SPRING.rx-16,SPRING.y+6);return}}
 for(let i=0;i<TREES.length;i++){const t=TREES[i];if(dist(x,y,t.x,t.y-58)<48||dist(x,y,t.x,t.y-15)<22){P.act={k:'tree',i};setT(t.x+(P.x<t.x?-34:34),t.y+6);return}}
 if(Math.abs(x-HOUSE.x)<66&&y<HOUSE.y+6&&y>HOUSE.y-135){P.act={k:'house'};setT(HOUSE.x,HOUSE.y+22);return}
 if(Math.abs(x-SHOP.x)<66&&y<SHOP.y+6&&y>SHOP.y-130){P.act={k:'shop'};setT(SHOP.x,SHOP.y+22);return}
 if(norm(x,y,SRX,SRY)>1){const e=edge(angleOf(x,y),SRX,SRY,.94);P.act={k:'fish'};setT(e.x,e.y);return}
 P.act=null;setT(x,y)}

// ---------- UPDATE ----------
function update(dt){time+=dt;
 const a=P.act;
 if(a&&a.k==='bug'){if(!bugs.includes(a.b)){P.act=null}else{P.tx=a.b.x+(P.x<a.b.x?-26:26);P.ty=a.b.y+4;if(dist(P.x,P.y,a.b.x,a.b.y)<48){catchBug(a.b);P.act=null}}}
 else if(a&&a.k==='talk'){P.tx=a.n.x+(P.x<a.n.x?-46:46);P.ty=a.n.y+2;if(dist(P.x,P.y,a.n.x,a.n.y)<58){P.act=null;P.tx=P.x;P.ty=P.y;openTalk(a.n)}}
 const dx=P.tx-P.x,dy=P.ty-P.y,d=Math.hypot(dx,dy),sp=175;
 if(d>3){const s=Math.min(d,sp*dt);P.x+=dx/d*s;P.y+=dy/d*s;P.walk+=dt*12;P.moving=true;if(Math.abs(dx)>2)P.face=dx>0?1:-1}
 else{P.moving=false;if(a&&!['bug','talk'].includes(a.k)){P.act=null;doAct(a)}}
 const vis=ONV();
 NEIGH.forEach((n,i)=>{if(vis&&!MP.offline){const k=Math.min(1,dt*8);n.x+=(n.tx-n.x)*k;n.y+=(n.ty-n.y)*k;return}
  if(talking===n){n.face=P.x>n.x?1:-1;return}const joins=!vis&&P.soak&&S.neigh[n.id].f>=3;
  if(joins){n.tx=SOAK[i].x;n.ty=SOAK[i].y}else if(n.soak){n.soak=false;n.tx=n.hx;n.ty=n.hy;n.wait=rnd(1,3)}
  const ddx=n.tx-n.x,ddy=n.ty-n.y,dd=Math.hypot(ddx,ddy);if(dd>2){const s=Math.min(dd,(joins?70:n.hi?160:38)*dt);n.x+=ddx/dd*s;n.y+=ddy/dd*s;if(Math.abs(ddx)>1)n.face=ddx>0?1:-1}else if(joins){n.soak=true;n.face=-1}else if(n.hi){n.hi=false;n.face=P.x>n.x?1:-1}else if((n.wait-=dt)<0){n.wait=rnd(2,6);n.tx=n.hx+rnd(-80,80);n.ty=n.hy+rnd(-50,50)}});
 if(!vis&&!VIS()&&P.soak&&S.soakDay!==S.dayKey){const want=NEIGH.filter(n=>S.neigh[n.id].f>=3),inn=want.filter(n=>n.soak);if(want.length&&inn.length===want.length){S.soakDay=S.dayKey;inn.forEach(n=>friend(n,1));SND.yay();openSpring(`Ahhh... ♨️ ${inn.map(n=>n.n).join(' and ')} came to soak with you! 💕 What a happy day!`);save()}}
 bugs.forEach(b=>{const it=ITEMS[b.t];b.ph+=dt;if((b.ch-=dt)<0){b.ch=rnd(1,3);const sp=it.fly?40:12,ang=rnd(0,6.28);b.vx=Math.cos(ang)*sp;b.vy=Math.sin(ang)*sp}
  if(b.flee>0){b.flee-=dt;const ex=b.x-P.x,ey=b.y-P.y,el=Math.hypot(ex,ey)||1;b.vx=ex/el*110;b.vy=ey/el*110}
  const nx=b.x+b.vx*dt,ny=b.y+b.vy*dt;if(norm(nx,ny,GRX,GRY)<.9){b.x=nx;b.y=ny}else{b.vx*=-1;b.vy*=-1}});
 if(!VIS()&&(bugTimer-=dt)<0){bugTimer=10;if(bugs.length<5)spawnBug()}
 TREES.forEach(t=>t.shake=Math.max(0,t.shake-dt));
 parts=parts.filter(p=>(p.life-=dt)>0);parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=260*dt});
 mpUpdate(dt);
 cam.x+=(P.x-cam.x)*Math.min(1,dt*6);cam.y+=(P.y-40+(talking?120/SCALE:0)-cam.y)*Math.min(1,dt*6);
 const hw=W/2/SCALE,hh=H/2/SCALE;cam.x=Math.max(hw-60,Math.min(1460-hw,cam.x));cam.y=Math.max(hh-60,Math.min(1180-hh,cam.y));
}

// ---------- ACTIONS ----------
function hostName(){return esc(MP.island?MP.island.name:'')}
function doAct(a){const vis=ONV();
 if(a.k==='tree'){const t=TREES[a.i];t.shake=.6;if(vis){toast(`Those are ${hostName()}'s ${t.f==='orange'?'oranges':'yuzu'}! ${ITEMS[t.f].e}<br>You can pick fruit on your own island.`);return}
  const n=S.trees[a.i];if(n>0){S.trees[a.i]=0;const first=addItem(t.f,n);burst(t.x,t.y-60,ITEMS[t.f].e,n+2);SND.pop();const h=S.stack.length;toast(`You picked ${n} ${ITEMS[t.f].n}! ${ITEMS[t.f].e}`+(first?'<br>✨ New in your book!':'')+(h>=12?`<br>WOW! ${h} fruit on your head! 🤣`:h>=6?`<br>You're balancing ${h} fruit on your head! 😆`:''));save()}else toast('No fruit left. It will grow back tomorrow! 🌙')}
 else if(a.k==='present'){if(vis){toast(`That present is for ${hostName()}! 🎁`);return}if(a.i>=S.presents.length)return;const p=presentPos(a.i);S.presents.splice(a.i,1);openPresent(p);save()}
 else if(a.k==='fpresent'){if(vis){toast(`That present is for ${hostName()}! 💝`);return}openFPresent(a.i)}
 else if(a.k==='house'){if(vis){toast(`That's ${hostName()}'s house! 🏠`);return}openHouse()}
 else if(a.k==='shop'){if(vis){toast('Berry says: "Come shopping on your own island!" 🦝');return}openShop()}
 else if(a.k==='fish'){if(vis){toast('No fishing on a visit.<br>You can fish at home! 🎣');return}startFish()}
 else if(a.k==='spring')enterSpring();
 else if(a.k==='dock')openDock();
}
function catchBug(b){const it=ITEMS[b.t];if(Math.random()<.85){bugs.splice(bugs.indexOf(b),1);const first=addItem(b.t);burst(b.x,b.y,'✨',6);SND.yay();toast(`You caught a ${it.n}! ${it.e}`+(first?'<br>✨ New in your book!':''));save()}else{b.flee=1.2;SND.oops();toast(`Oh no, the ${it.n} got away! Try again!`)}}
function openPresent(p){SND.yay();burst(p.x,p.y,'🎉',8);if(Math.random()<.55){const c=pick([100,150,200,250,300]);S.coins+=c;hud();modal(`<h2>🎁 A present!</h2><div style="text-align:center;font-size:60px">🪙</div><p style="text-align:center;font-size:20px;font-weight:800">It was full of coins!<br>+${c} coins</p><div class="row"><button class="btn" onclick="closeModal()">Yay!</button></div>`)}
 else{const id=Math.random()<.4?pick(PRESENT_ONLY):pick(BUYABLE);const first=addItem(id);modal(`<h2>🎁 A present!</h2><div style="text-align:center;font-size:70px">${ITEMS[id].e}</div><p style="text-align:center;font-size:20px;font-weight:800">You got a ${ITEMS[id].n}!${first?'<br>✨ New in your book!':''}</p><p style="text-align:center">Put it in your house! 🏠</p><div class="row"><button class="btn" onclick="closeModal()">Yay!</button></div>`)}}
function openFPresent(i){const p=S.fpresents[i];if(!p)return;S.fpresents.splice(i,1);const id=ITEMS[p.item]&&ITEMS[p.item].k==='furn'?p.item:pick(GIFT_POOL),first=addItem(id),pp=posAt(p.a);SND.yay();burst(pp.x,pp.y,'💝',8);save();
 modal(`<h2>🎁 From ${esc(p.from)}!</h2><div style="text-align:center;font-size:70px">${ITEMS[id].e}</div><p style="text-align:center;font-size:20px;font-weight:800">Your friend ${esc(p.from)} left you a ${ITEMS[id].n}!${first?'<br>✨ New in your book!':''}</p><p style="text-align:center">Put it in your house! 🏠</p><div class="row"><button class="btn" onclick="closeModal()">Yay! 💕</button></div>`)}

// ---------- TALK ----------
function hearts(f){const full=Math.floor(f/2);let s='';for(let i=0;i<5;i++)s+=i<full?'💗':'🤍';return s}
function openTalk(n,override){
 if(VIS()){talking=n;const T=$('#talk');T.classList.remove('hidden');T.querySelector('.tn').textContent=n.e+' '+n.n;T.querySelector('.tt').innerHTML=pick([`Hi ${esc(S.name)}! Welcome to ${hostName()}'s island! 🌸`,`Yay, a visitor! Hi ${esc(S.name)}! 💕`].concat(n.lines));T.querySelector('.th').textContent='';const row=T.querySelector('.row');row.innerHTML='';const bye=document.createElement('button');bye.className='btn white';bye.textContent='Bye! 👋';bye.onclick=closeTalk;row.appendChild(bye);return}
 talking=n;const s=S.neigh[n.id];if(!s.talked){s.talked=true;friend(n,1)}
 const T=$('#talk');T.classList.remove('hidden');T.querySelector('.tn').textContent=n.e+' '+n.n;const row=T.querySelector('.row');row.innerHTML='';
 let text=override;
 if(!text){if(!s.done&&s.req){const it=ITEMS[s.req];text=`Hi ${esc(S.name)}! Could you bring me ${it.k==='fruit'?'some':'a'} ${it.n} ${it.e}? That would make me so happy!`}else text=pick(n.lines)}
 T.querySelector('.tt').innerHTML=text;T.querySelector('.th').textContent='Friendship '+hearts(s.f);
 if(!s.done&&s.req&&S.bag[s.req]&&!override){const b=document.createElement('button');b.className='btn';b.textContent='Give '+ITEMS[s.req].e;b.onclick=()=>give(n);row.appendChild(b)}
 const bye=document.createElement('button');bye.className='btn white';bye.textContent='Bye! 👋';bye.onclick=closeTalk;row.appendChild(bye);save()}
function closeTalk(){talking=null;$('#talk').classList.add('hidden')}
function friend(n,v){const s=S.neigh[n.id];s.f=Math.min(10,s.f+v);burst(n.x,n.y-40,'💗',4)}
function give(n){const s=S.neigh[n.id];if(!takeItem(s.req))return;s.done=true;S.coins+=150;hud();friend(n,2);SND.coin();
 let msg=`Thank you, ${esc(S.name)}!! 💕 Here are 150 coins!`;
 const thr=[4,10];thr.forEach((t,i)=>{const g=n.gifts[i];if(s.f>=t&&!s.g.includes(g)){s.g.push(g);addItem(g);msg+=`<br>And I made you a present because we're friends: ${ITEMS[g].n} ${ITEMS[g].e}!`;SND.yay()}});

function enterSpring(){P.soak=true;if(ONV()){const v=pick(VSOAK);P.x=v.x;P.y=v.y}else{P.x=SPRING.x-28;P.y=SPRING.y+4}P.tx=P.x;P.ty=P.y;P.face=1;SND.pop();burst(P.x,P.y-20,'💦',5);openSpring()}
function leaveSpring(){P.soak=false;P.x=SPRING.x-SPRING.rx-16;P.y=SPRING.y+6;P.tx=P.x;P.ty=P.y}
function openSpring(msg){talking='spring';const T=$('#talk');T.classList.remove('hidden');T.querySelector('.tn').textContent='♨️ Hot Spring';const row=T.querySelector('.row');row.innerHTML='';
 const add=(t,f,c)=>{const b=document.createElement('button');b.className='btn'+(c?' '+c:'');b.textContent=t;b.onclick=f;row.appendChild(b)};
 if(ONV()){T.querySelector('.tt').innerHTML=`Ahhh... so warm! ♨️ ${hostName()}'s hot spring is the best!`;T.querySelector('.th').textContent='';add('Get out',()=>{closeTalk();leaveSpring()},'white');return}
 const fr=NEIGH.filter(n=>S.neigh[n.id].f>=3);
 T.querySelector('.tt').innerHTML=msg||(fr.length?`Ahhh... so warm! ${fr.map(n=>n.e+' '+n.n).join(' and ')} ${fr.length>1?'are':'is'} coming to soak with you!`:`Ahhh... so warm! ♨️ Help your friends, and they'll come soak with you.`);
 T.querySelector('.th').textContent=S.yuzu?`🍋 ${S.yuzu} yuzu floating in the water`:'';
 if(S.bag.yuzu)add('Toss in a yuzu 🍋',tossYuzu);add('Decorate 🏮',decoSpring);add('Get out',()=>{closeTalk();leaveSpring()},'white')}
function tossYuzu(){if(VIS()||!takeItem('yuzu'))return;S.yuzu++;SND.pop();burst(SPRING.x,SPRING.y-10,'💛',4);save();openSpring(pick(['Plop! Now the water smells like yuzu! 🍋','Plop! A cozy yuzu bath! 💛','Splash! Another yuzu for the spring!']))}

function parseBackup(txt){txt=String(txt||'').trim();if(!txt)throw 0;let o;

 return{save:sv,date:date&&!isNaN(date)?date:null}}

// ---------- CLOUD: Supabase save, best friends, live visits over Realtime ----------
// Everything below is inert when SUPABASE_URL / SUPABASE_ANON_KEY are empty (CL.on === false).
const SBJS_SRC=['https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js','https://unpkg.com/@supabase/supabase-js@2.117.2/dist/umd/supabase.js'];
const SBJS_SRI='sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok';
const UUID_RE=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
function clHashS(){const o=Object.assign({},S);delete o.x;delete o.y;const s=JSON.stringify(o);let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(36)+'.'+s.length}
function clMetaSave(){if(!CL.on||restoring)return;try{localStorage.setItem(CMETA,JSON.stringify(CL.meta))}catch(e){}}
function clMetaSet(o){Object.assign(CL.meta,o);try{localStorage.setItem(CMETA,JSON.stringify(CL.meta))}catch(e){}}
function clLoad(){return new Promise((res,rej)=>{let i=0;const next=()=>{if(window.supabase&&window.supabase.createClient)return res();if(i>=SBJS_SRC.length)return rej(new Error('supabase-js could not load'));
 const s=document.createElement('script');s.src=SBJS_SRC[i++];s.integrity=SBJS_SRI;s.crossOrigin='anonymous';s.async=true;s.onload=next;s.onerror=()=>{s.remove();next()};document.head.appendChild(s)};next()})}
async function clRpc(fn,args){const r=await CL.sb.rpc(fn,args||{});if(r.error){const e=new Error(r.error.message||fn);e.code=r.error.code;throw e}return r.data}
const clErr=e=>String(e&&e.message||e||'');

// called from save() whenever the island really changed (position ignored)
function clOnSave(){if(!S.name||CL.status==='moved')return;const h=clHashS();if(h===CL.hash)return;CL.hash=h;CL.meta.localTs=Date.now();CL.meta.dirty=true;clMetaSave();clSchedule()}
function clSchedule(){if(!CL.ready)return;const now=Date.now();if(!CL.firstDirty)CL.firstDirty=now;clearTimeout(CL.upT);CL.upT=setTimeout(()=>clUpload(),Math.max(0,Math.min(4000,CL.firstDirty+20000-now)))}
function clBody(ts){return{owner:CL.uid,save:S,snapshot:snapshot(),save_ts:ts,dropins:CL.dropins}}
async function clUpload(force){if(!CL.sb||!CL.uid||CL.status==='moved'||!S.name)return false;if(!force&&!CL.meta.dirty)return true;
 if(CL.uploading){CL.again=true;try{await CL.uploading}catch(e){}if(!force)return true}
 CL.firstDirty=0;clearTimeout(CL.upT);const ts=CL.meta.localTs||Date.now();
 CL.uploading=(async()=>{const r=await CL.sb.from('islands').upsert(clBody(ts),{onConflict:'owner'});
  if(r.error){CL.err=r.error.message||'upload failed';if(r.error.code==='42501'){const st=await clRpc('my_cloud_status').catch(()=>null);if(st&&st.moved)clMoved()}return false}
  CL.meta.syncedTs=ts;if(CL.meta.localTs===ts)CL.meta.dirty=false;CL.lastUp=Date.now();CL.err='';clMetaSave();return true})();
 try{return await CL.uploading}catch(e){CL.err=clErr(e);return false}finally{CL.uploading=null;if(CL.again){CL.again=false;if(CL.meta.dirty)clSchedule()}}}
// page is being hidden/closed: fire-and-forget upload that survives the page going away
function clFlush(){if(!CL.ready||!CL.meta.dirty||!CL.token||!S.name)return;const ts=CL.meta.localTs,body=JSON.stringify(clBody(ts));if(body.length>60000){clUpload(true);return}
 try{fetch(SUPABASE_URL.replace(/\/+$/,'')+'/rest/v1/islands?on_conflict=owner',{method:'POST',keepalive:true,headers:{apikey:SUPABASE_ANON_KEY,Authorization:'Bearer '+CL.token,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},body})
  .then(r=>{if(r.ok){CL.meta.syncedTs=ts;if(CL.meta.localTs===ts)CL.meta.dirty=false;CL.lastUp=Date.now();clMetaSave()}}).catch(()=>{})}catch(e){}}

async function clInit(){if(!CL.on||CL.initing||CL.ready||restoring)return;CL.initing=true;if(CL.status!=='moved')CL.status='loading';
 try{
  await clLoad();
  if(!CL.sb){CL.sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storageKey:'capyIsland.auth'}});
   CL.sb.auth.onAuthStateChange((ev,s)=>{CL.token=s&&s.access_token||null})}
  let s=(await CL.sb.auth.getSession()).data.session;
  if(!s){const r=await CL.sb.auth.signInAnonymously();if(r.error)throw r.error;s=r.data.session}
  CL.uid=s.user.id;CL.token=s.access_token;
  if(CL.meta.uid!==CL.uid){CL.meta.uid=CL.uid;CL.meta.syncedTs=0;if(S.name){CL.meta.localTs=CL.meta.localTs||Date.now();CL.meta.dirty=true}}
  clMetaSave();
  const st=await clRpc('my_cloud_status');
  if(st&&st.moved){clMoved();CL.initing=false;return}
  CL.status='ok';
  // cloud copy is newer than this phone's copy (e.g. island moved here): use it
  if(st&&st.has_island&&Number(st.save_ts)>(CL.meta.localTs||0)&&!MP.role){if(await clAdopt()){CL.initing=false;return}}
  CL.ready=true;CL.err='';
  if(!st||!st.has_island||CL.meta.dirty)await clUpload(true);
  clLobbyStart();clHeartbeat();clFriendsRefresh().then(()=>refreshDock());
  clearInterval(CL.hbT);CL.hbT=setInterval(clHeartbeat,60000);

// A private Realtime channel wrapped to look like a PeerJS DataConnection (on/send/close/open/peer),
// so the existing host/visitor code runs unchanged over Supabase.
class CloudConn{constructor(topic,peer){this.peer=peer;this.cloud=true;this.open=false;this.closed=false;this.h={};this.last={};this.lastT={};
  const ch=CL.sb.channel(topic,{config:{private:true,broadcast:{self:false}}});this.ch=ch;
  ch.on('broadcast',{event:'m'},m=>{if(this.open&&m&&m.payload&&typeof m.payload==='object')this.emit('data',m.payload)});
  ch.subscribe((st,err)=>{if(this.ch!==ch)return;if(st==='SUBSCRIBED'){if(!this.open&&!this.closed){this.open=true;this.emit('open')}}
   else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'||st==='CLOSED'){const was=this.open;this.open=false;if(!this.closed){this.closed=true;this.ch=null;try{CL.sb.removeChannel(ch)}catch(e){}this.emit(was?'close':'error',err)}}})}
 on(ev,f){(this.h[ev]=this.h[ev]||[]).push(f);return this}
 emit(ev,a){(this.h[ev]||[]).slice().forEach(f=>{try{f(a)}catch(e){console.error(e)}})}
 // position packets: max ~6/s, and none while nothing moves (2s keep-alive) => about half the Realtime quota of 12/s
 send(m){if(!this.open||!this.ch)return;if(m&&(m.t==='p'||m.t==='ps')){const j=JSON.stringify(m),now=performance.now(),dt=now-(this.lastT[m.t]||0);if(dt<2000&&(j===this.last[m.t]||dt<150))return;this.last[m.t]=j;this.lastT[m.t]=now}
  this.ch.send({type:'broadcast',event:'m',payload:m}).catch(()=>{})}
 close(){if(this.closed)return;const was=this.open;this.open=false;this.closed=true;const ch=this.ch;this.ch=null;if(ch)setTimeout(()=>{try{CL.sb.removeChannel(ch)}catch(e){}},250);if(was)this.emit('close')}}

 $('#go').onclick=()=>{S.name=($('#nm').value.trim()||'Emi').slice(0,12);closeModal();newDay(true);hud();save();toast('Look! There are presents on the beach! 🎁',3500);maybeVisit()}}
if(QS.has('newday')){S.dayKey='';}
hud();
if(!S.name)welcome();
else{if(newDay()){hud();setTimeout(()=>toast(`Good morning, ${esc(S.name)}! 🌞<br>The fruit grew back and your friends need help!`+(S.fpresents.length?'<br>💝 A friend left you a present on the beach!':''),4000),300)}else{for(let i=0;i<4;i++)spawnBug()}maybeVisit()}
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else if(S.name&&!VIS()&&newDay()){hud();toast(`Good morning, ${esc(S.name)}! 🌞 A new day on Capy Island!`,3500)}});
addEventListener('pagehide',()=>{if(MP.role==='visitor')try{MP.conn&&MP.conn.send({t:'bye'})}catch(e){}if(MP.role==='host')try{broadcast({t:'closed'})}catch(e){}});
setInterval(save,5000);
requestAnimationFrame(loop);
if(CL.on)clStart();
</script>
</body>
</html>
