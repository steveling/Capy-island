<title>Capy Island</title>
<script>
// If a script fails while the game starts, the browser has probably mixed new and old cached files (GitHub
// Pages lets it reuse them for 10 minutes). Reload once from a fresh address, which skips the cached page and
// so gets every file of the new version. At most once a minute, so a real bug can't cause a reload loop.
window.capyBooting = true;
addEventListener('error', function () {
  if (!window.capyBooting) return;
  window.capyBooting = false;
  try {
    var last = +sessionStorage.getItem('capyIsland.fresh') || 0;
    if (Date.now() - last < 60000) return;
    sessionStorage.setItem('capyIsland.fresh', String(Date.now()));
  } catch (e) {
    return;
  }
  var q = new URLSearchParams(location.search);
  q.set('fresh', Date.now().toString(36));
  location.replace(location.pathname + '?' + q + location.hash);
});
</script>
