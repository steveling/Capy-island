<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ff8cc6">

<title>Capy Island</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#7fd3f0;font-family:"Nunito","Trebuchet MS",system-ui,sans-serif;touch-action:none}
canvas{display:block;position:fixed;inset:0}
.hidden{display:none!important}
#top{position:fixed;top:calc(8px + env(safe-area-inset-top));left:8px;right:8px;display:flex;justify-content:space-between;pointer-events:none;z-index:5}
.pill{background:#fff;border:3px solid #ff8cc6;border-radius:999px;padding:6px 14px;font-weight:800;font-size:18px;color:#c2427f;box-shadow:0 3px 0 #e56aa8}
#bottom{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:center;gap:14px;z-index:5}
#bottom button{width:74px;height:74px;border-radius:24px;border:3px solid #ff8cc6;background:#fff;font-size:30px;box-shadow:0 4px 0 #e56aa8;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;color:#c2427f}
#bottom button span{font-size:13px;font-weight:800;margin-top:2px}
#bottom button:active{transform:translateY(3px);box-shadow:0 1px 0 #e56aa8}
#toast{position:fixed;top:calc(64px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#fff;color:#c2427f;border:3px solid #ff8cc6;border-radius:18px;padding:10px 16px;font-weight:800;font-size:17px;text-align:center;max-width:88vw;z-index:20;box-shadow:0 4px 0 #e56aa8;transition:opacity .3s;opacity:0;pointer-events:none}
#toast.show{opacity:1}
#modal{position:fixed;inset:0;background:rgba(120,40,80,.35);display:flex;align-items:center;justify-content:center;z-index:30;padding:14px}
.card{background:#fff7fb;border:4px solid #ff8cc6;border-radius:26px;width:min(440px,100%);max-height:88vh;overflow:auto;padding:18px;box-shadow:0 6px 0 #e56aa8;color:#7a2a55}
.card h2{margin:0 0 10px;text-align:center;color:#d94b90;font-size:24px}
.btn{border:3px solid #ff8cc6;background:#ff9fcf;color:#fff;font-weight:900;font-size:17px;border-radius:16px;padding:10px 16px;box-shadow:0 3px 0 #e56aa8;font-family:inherit}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #e56aa8}
.btn.white{background:#fff;color:#d94b90}
.btn:disabled{opacity:.45}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.tabs{display:flex;gap:8px;justify-content:center;margin-bottom:12px}
.tabs .btn{padding:8px 12px;font-size:15px}
.tabs .btn.off{background:#fff;color:#d94b90}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cell{background:#fff;border:3px solid #ffd0e6;border-radius:16px;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:30px;position:relative}
.cell small{font-size:11px;font-weight:800;color:#b0487c;text-align:center;line-height:1.1;padding:0 2px}
.cell .cnt{position:absolute;top:2px;right:6px;font-size:13px;font-weight:900;color:#d94b90}
.cell.unk{background:#f4e6ee;color:#caa;font-size:26px;font-weight:900}
.list .li{display:flex;align-items:center;gap:10px;background:#fff;border:3px solid #ffd0e6;border-radius:16px;padding:8px 10px;margin-bottom:8px}
.li .e{font-size:30px}
.li .t{flex:1;font-weight:800}
.li .t small{display:block;font-weight:700;color:#b0487c}
.li .btn{padding:6px 10px;font-size:14px}
input.name{font-size:22px;font-weight:800;text-align:center;border:3px solid #ff8cc6;border-radius:16px;padding:10px;width:100%;color:#c2427f;font-family:inherit}
#talk{position:fixed;left:10px;right:10px;bottom:calc(100px + env(safe-area-inset-bottom));z-index:25;background:#fff;border:4px solid #ff8cc6;border-radius:24px;padding:14px 16px;box-shadow:0 5px 0 #e56aa8;color:#7a2a55;max-width:520px;margin:0 auto}
#talk .tn{position:absolute;top:-18px;left:18px;background:#ff8cc6;color:#fff;border-radius:999px;padding:3px 14px;font-weight:900;font-size:16px}
#talk .tt{font-size:18px;font-weight:700;margin-top:4px;min-height:44px}
#talk .th{font-size:15px;margin-top:6px}
#fish{position:fixed;inset:0;z-index:28;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(40,110,160,.35)}
#fwater{width:min(360px,86vw);height:230px;border-radius:30px;background:radial-gradient(circle at 50% 50%,#9fe3ff,#4db6e6);border:4px solid #fff;position:relative;overflow:hidden;box-shadow:0 6px 0 rgba(0,0,0,.15)}
#bobber{position:absolute;left:50%;top:50%;font-size:40px;transform:translate(-50%,-50%);transition:transform .15s}
#ripple{position:absolute;left:50%;top:50%;width:60px;height:24px;border:3px solid rgba(255,255,255,.8);border-radius:50%;transform:translate(-50%,-10%);animation:rip 1.6s infinite}
@keyframes rip{0%{width:30px;height:10px;opacity:1}100%{width:140px;height:50px;opacity:0}}
#fmsg{margin-top:14px;font-size:22px;font-weight:900;color:#fff;text-shadow:0 2px 0 #2b7fb0;text-align:center;padding:0 10px}
#fish .btn{margin-top:14px}
#fbtn{font-size:24px;padding:14px 30px}
#fbtn.bite{animation:pulse .3s infinite alternate;background:#ff5fa8}
@keyframes pulse{to{transform:scale(1.12)}}
#house{position:fixed;inset:0;z-index:27;background:#ffe3ef;display:flex;flex-direction:column;align-items:center;padding:calc(14px + env(safe-area-inset-top)) 10px 10px}
#house h2{color:#d94b90;margin:6px 0 4px}
#house .hint{color:#b0487c;font-weight:700;font-size:14px;margin-bottom:8px;text-align:center}
#room{width:min(420px,94vw);border:6px solid #e882b4;border-radius:18px;overflow:hidden;background:#fff}
#wall{height:60px;background:repeating-linear-gradient(90deg,#ffc0dc 0 18px,#ffd6e8 18px 36px);border-bottom:6px solid #d9709f;display:flex;align-items:center;justify-content:center;font-size:30px}
#floor{display:grid;grid-template-columns:repeat(5,1fr);background:repeating-conic-gradient(#fff1f7 0 25%,#ffdcec 0 50%) 0 0/25% 33.33%}
#floor .slot{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:38px;border:1px dashed rgba(217,112,159,.25)}
#score{margin-top:10px;font-weight:900;color:#d94b90;font-size:18px}
#mppill{position:fixed;top:calc(58px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:6;font-size:15px;padding:5px 12px;white-space:nowrap;pointer-events:auto;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
body.mp #toast{top:calc(104px + env(safe-area-inset-top))}
#emobar{position:fixed;left:0;right:0;bottom:calc(96px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:8px;z-index:24}
#emobar button{width:54px;height:54px;border-radius:18px;border:3px solid #ff8cc6;background:#fff;font-size:30px;box-shadow:0 3px 0 #e56aa8;padding:0;font-family:inherit}
#emobar button:active{transform:translateY(2px);box-shadow:0 1px 0 #e56aa8}
.code{font-size:46px;font-weight:900;letter-spacing:8px;text-align:center;color:#d94b90;background:#fff;border:4px dashed #ff8cc6;border-radius:20px;padding:6px 0 6px 8px;margin:6px 0;font-family:inherit}
input.code{width:100%;text-transform:uppercase;outline:none}
input.code::placeholder{color:#f3c2da}
.big{display:block;width:100%;font-size:21px;padding:14px;margin-top:10px}
.sws{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:6px}
.sw{width:42px;height:42px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 3px #ffd0e6;padding:0}
.sw.on{box-shadow:0 0 0 4px #d94b90}
.dot{display:inline-block;width:18px;height:18px;border-radius:50%;vertical-align:middle;margin-right:6px;border:2px solid #fff;box-shadow:0 0 0 2px #ffd0e6}
.note{background:#fff;border:3px dashed #ffd0e6;border-radius:16px;padding:10px;text-align:center;font-weight:700;margin-top:10px}
.card h3{margin:14px 0 6px;color:#d94b90;text-align:center}
.card p.c{text-align:center;font-weight:700}
.fly{animation:fly 1.2s ease-in-out infinite alternate}
@keyframes fly{from{transform:translate(-20px,6px) rotate(-6deg)}to{transform:translate(20px,-6px) rotate(6deg)}}
#gear{position:fixed;top:calc(62px + env(safe-area-inset-top));right:10px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.7);border:3px solid #ffd0e6;font-size:19px;z-index:6;padding:0;color:#c2427f;display:flex;align-items:center;justify-content:center;touch-action:none;transition:background 1.5s linear,transform .2s}
#gear.hold{background:#ff8cc6;transform:scale(1.15)}
textarea.bk{width:100%;height:80px;border:3px solid #ffd0e6;border-radius:14px;padding:8px;font-size:12px;font-family:monospace;color:#7a2a55;user-select:text;-webkit-user-select:text}
.card label.btn{display:inline-block;cursor:pointer}
</style>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js" async></script>
</head>
<body>
<canvas id="c"></canvas>
<div id="top"><div class="pill" id="coins">🪙 0</div><div class="pill" id="daypill">☀️ Day 1</div></div>
<div id="bottom">
  <button id="bBag">🎒<span>Bag</span></button>
  <button id="bBook">📖<span>Book</span></button>
  <button id="bHome">🏠<span>Home</span></button>
  <button id="bEmo" class="hidden">😊<span>Emote</span></button>
  <button id="bLeave" class="hidden">✈️<span>Leave</span></button>
</div>
<div class="pill hidden" id="mppill"></div>
<button id="gear" aria-label="Grown-ups (press and hold)">⚙️</button>
<div id="emobar" class="hidden"></div>
<div id="toast"></div>
<div id="talk" class="hidden"><div class="tn"></div><div class="tt"></div><div class="th"></div><div class="row"></div></div>
<div id="fish" class="hidden"><div id="fwater"><div id="ripple"></div><div id="bobber">🔴</div></div><div id="fmsg"></div><button class="btn" id="fbtn">Reel in!</button><button class="btn white" id="fcancel">Stop fishing</button></div>
<div id="house" class="hidden"><h2 id="htitle">My House</h2><div class="hint">Tap a square to put furniture there. Tap furniture to put it away.</div><div id="room"><div id="wall">🪟 💗 🪟</div><div id="floor"></div></div><div id="score"></div><div class="row"><button class="btn" id="hexit">Go outside 🌳</button></div></div>
<div id="modal" class="hidden"><div class="card" id="card"></div></div>
<script>
"use strict";
const $=s=>document.querySelector(s);
const cv=$('#c');let ctx=cv.getContext('2d');
let W,H,DPR,SCALE,ER=1,AMB=null,WG=null,islReady=false;const EC=new Map();
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';SCALE=Math.max(.8,Math.min(1.7,Math.min(W,H)/400));
 ER=Math.min(DPR*SCALE,3);EC.clear();AMB=null;WG=null;ctx=cv.getContext('2d');if(islReady)buildIsland()}
addEventListener('resize',resize);resize();
const EMO='"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif';
const rnd=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.floor(Math.random()*a.length)], dist=(a,b,c,d)=>Math.hypot(a-c,b-d);
const esc=s=>String(s==null?'':s).replace(/[&<>"'`]/g,c=>'&#'+c.charCodeAt(0)+';');

// ---------- DATA ----------
const ITEMS={
 orange:{e:'🍊',n:'Orange',p:30,k:'fruit'},yuzu:{e:'🍋',n:'Yuzu',p:40,k:'fruit'},
 butterfly:{e:'🦋',n:'Butterfly',p:60,k:'bug',w:20,fly:1},ladybug:{e:'🐞',n:'Ladybug',p:50,k:'bug',w:20},bee:{e:'🐝',n:'Bee',p:90,k:'bug',w:12,fly:1},caterpillar:{e:'🐛',n:'Caterpillar',p:40,k:'bug',w:18},cricket:{e:'🦗',n:'Cricket',p:70,k:'bug',w:12},snail:{e:'🐌',n:'Snail',p:45,k:'bug',w:15},ant:{e:'🐜',n:'Ant',p:30,k:'bug',w:15},beetle:{e:'🪲',n:'Shiny Beetle',p:250,k:'bug',w:4},
 fish:{e:'🐟',n:'Little Fish',p:50,k:'fish',w:30},tropical:{e:'🐠',n:'Rainbow Fish',p:120,k:'fish',w:18},crab:{e:'🦀',n:'Crab',p:90,k:'fish',w:16},shrimp:{e:'🦐',n:'Shrimp',p:60,k:'fish',w:16},puffer:{e:'🐡',n:'Pufferfish',p:200,k:'fish',w:8},squid:{e:'🦑',n:'Squid',p:180,k:'fish',w:7},octopus:{e:'🐙',n:'Octopus',p:250,k:'fish',w:5},shark:{e:'🦈',n:'Shark',p:600,k:'fish',w:2}
};
const FURN=[['bed','🛏️','Cozy Bed',300],['chair','🪑','Wooden Chair',150],['sofa','🛋️','Comfy Sofa',450],['plant','🪴','Potted Plant',120],['teddy','🧸','Teddy Bear',200],['painting','🖼️','Painting',350],['bow','🎀','Giant Bow',250],['tulips','🌷','Tulip Vase',140],['piano','🎹','Piano',800],['tv','📺','TV',600],['mirror','🪞','Mirror',300],['lantern','🏮','Paper Lantern',220],['clock','🕰️','Clock',280],['teapot','🫖','Teapot',160],['cake','🎂','Party Cake',260],['guitar','🎸','Guitar',500],['basket','🧺','Picnic Basket',130],['globe','🌍','Globe',320],['books','📚','Bookshelf',380],['bath','🛁','Bathtub',700],
 ['unicorn','🦄','Unicorn Plush',0,1],['carousel','🎠','Carousel',0,1],['fountain','⛲','Fountain',0,1],['rainbow','🌈','Rainbow',0,1],['crown','👑','Royal Crown',0,1],['cupcake','🧁','Cupcake Tower',0,1],['doll','🪆','Nesting Dolls',0,1],['trophy','🏆','Golden Trophy',0,1],['balloon','🎈','Balloons',0,1],['sparkle','💖','Sparkly Heart',0,1]];
FURN.forEach(([id,e,n,p,g])=>ITEMS[id]={e,n,p:g?100:Math.round(p/4),buy:p,k:'furn',gift:!!g});
const ids=k=>Object.keys(ITEMS).filter(i=>ITEMS[i].k===k);
const BUYABLE=ids('furn').filter(i=>!ITEMS[i].gift), PRESENT_ONLY=['cupcake','doll','trophy','sparkle'], GIFT_POOL=BUYABLE.concat(PRESENT_ONLY);
function weighted(k){const l=ids(k);let t=l.reduce((s,i)=>s+ITEMS[i].w,0),r=Math.random()*t;for(const i of l){r-=ITEMS[i].w;if(r<=0)return i}return l[0]}
// capybara colours: b=body l=light d=dark s=snout
const CAPY={pink:{n:'Pink',b:'#f39ac0',l:'#fcc6de',d:'#d9779f',s:'#e684ae'},caramel:{n:'Caramel',b:'#d9a066',l:'#f0c895',d:'#b37843',s:'#c98c55'},cocoa:{n:'Cocoa',b:'#a8795a',l:'#c99f80',d:'#80573b',s:'#946848'},cream:{n:'Cream',b:'#f1dfbf',l:'#fff4e0',d:'#d2b98f',s:'#e2cba4'},lavender:{n:'Lavender',b:'#c5a6ee',l:'#e0cefa',d:'#9f7fd0',s:'#b394e0'},mint:{n:'Mint',b:'#92dbbe',l:'#c2f0dd',d:'#68b898',s:'#7ccaab'},sky:{n:'Sky',b:'#9ac8f2',l:'#c7e2fb',d:'#709dd0',s:'#84b2e2'},peach:{n:'Peach',b:'#f6b08b',l:'#fdd3ba',d:'#d98c66',s:'#e89e78'}};
const EMOTES=['👋','💖','😂','⭐','✨','🎵'], STAMPS=['🌸','🍊','🐾','⭐','🎀','🌈'];
const WRAPS={pink:'#ff8cc6',mint:'#5fd3a8',sky:'#6fb6ff',sun:'#ffc83d',lilac:'#b48cff',cherry:'#ff5f73'};
const CODE_ABC='ABCDEFGHJKMNPQRSTUVWXYZ23456789';

const CX=700,CY=560,SRX=630,SRY=475,GRX=560,GRY=412;
function wob(t){return 1+.05*Math.sin(3*t)+.035*Math.sin(5*t+1.3)+.02*Math.sin(9*t+2)}
function norm(x,y,rx,ry){const dx=(x-CX)/rx,dy=(y-CY)/ry;return Math.hypot(dx,dy)/wob(Math.atan2(dy,dx))}
function angleOf(x,y){return Math.atan2((y-CY)/SRY,(x-CX)/SRX)}
function edge(t,rx,ry,k){const w=wob(t)*k;return{x:CX+Math.cos(t)*rx*w,y:CY+Math.sin(t)*ry*w}}

const HOUSE={x:560,y:370},SHOP={x:870,y:370},SPRING={x:700,y:700,rx:75,ry:42};
const DECO_A=[Math.PI,-2.36,-1.57,-.79,.79,2.36],SOAK=[{x:710,y:692},{x:738,y:708},{x:695,y:716}],VSOAK=[{x:664,y:690},{x:680,y:722},{x:722,y:684},{x:752,y:716}];
function decoPos(i){const a=DECO_A[i];return{x:SPRING.x+Math.cos(a)*(SPRING.rx+26),y:SPRING.y+Math.sin(a)*(SPRING.ry+22)}}
// seaplane dock ("Capy Air") on the south-west beach
const DA=2.0,DOCK=(()=>{const p=edge(DA,SRX,SRY,.9);return{x:Math.round(p.x),y:Math.round(p.y)}})();
const PIER=(()=>{const p=edge(DA,SRX,SRY,.95);return{x:Math.round(p.x),y:Math.round(p.y)-8,len:122}})();
const PLANE={x:PIER.x+84,y:PIER.y+PIER.len-26},SIGN={x:DOCK.x-50,y:DOCK.y-4};
const TREES=[[270,660,'orange'],[460,860,'yuzu'],[950,860,'orange'],[1130,660,'yuzu'],[300,410,'orange'],[1110,410,'yuzu'],[520,610,'yuzu'],[890,610,'orange']].map(([x,y,f])=>({x,y,f,shake:0}));
const NEIGH=[
 {id:'mochi',e:'🐰',n:'Mochi',hx:410,hy:520,gifts:['unicorn','carousel'],lines:["Hop hop! What a lovely day!","I tried to count the clouds. I got to eleven!","You have fruit on your head again! Hee hee!","The hot spring is my favorite place on the whole island!"]},
 {id:'pip',e:'🐤',n:'Pip',hx:990,hy:520,gifts:['rainbow','crown'],lines:["Tweet tweet! I learned a new song today!","Pink is the best color. Everybody knows that!","I saw a shiny beetle by the trees once!","Can I sit on top of your fruit? Just kidding! Tweet!"]},
 {id:'puddle',e:'🦆',n:'Puddle',hx:700,hy:860,gifts:['balloon','fountain'],lines:["Quack! You're my best friend!","I love splashing in the hot spring!","Fishing is fun! Wait for the splash, then tap!","Capybaras are the calmest animals ever. Quack!"]}
].map(n=>Object.assign(n,{x:n.hx,y:n.hy,tx:n.hx,ty:n.hy,wait:rnd(1,4),face:1}));

// ---------- MULTIPLAYER STATE (logic further below) ----------
const MP={role:null,peer:null,conn:null,code:null,hostState:null,vis:new Map(),players:new Map(),emo:new Map(),island:null,me:null,acc:0,lastRx:0,dirty:false,islT:0,islJ:'',signed:false,gave:false,savedBugs:null,dockOpen:false,dockView:'main',to:null,tries:0,emoT:0};
const VIS=()=>MP.role==='visitor'||MP.role==='connecting';
const ONV=()=>MP.role==='visitor'&&!!MP.island; // rendering the HOST's island

// ---------- SAVE ----------
const KEY='capyIsland.v2';
function newSave(){const neigh={};NEIGH.forEach(n=>neigh[n.id]={f:0,req:null,done:false,talked:false,g:[]});return{name:'',coins:200,bag:{},found:{},day:0,dayKey:'',trees:TREES.map(()=>3),presents:[],neigh,stock:[],room:Array(20).fill(null),x:700,y:490,stack:[],spring:Array(6).fill(null),yuzu:0,soakDay:'',vcolor:'caramel',guestbook:[],giftsPending:[],fpresents:[]}}
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.neigh)S=newSave();
(function migrate(){const d=newSave();for(const k in d)if(S[k]===undefined)S[k]=d[k];
 NEIGH.forEach(n=>{if(!S.neigh[n.id])S.neigh[n.id]=d.neigh[n.id]});
 ['guestbook','giftsPending','fpresents','presents','stack','stock'].forEach(k=>{if(!Array.isArray(S[k]))S[k]=[]});
 if(!Array.isArray(S.room))S.room=d.room;if(!Array.isArray(S.spring))S.spring=d.spring;if(!Array.isArray(S.trees)||S.trees.length!==TREES.length)S.trees=d.trees;
 if(!CAPY[S.vcolor])S.vcolor='caramel';if(typeof S.x!=='number'||typeof S.y!=='number'){S.x=700;S.y=490}})();
function save(){if(VIS()||restoring)return;S.x=P.x;S.y=P.y;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(MP.role==='host')MP.dirty=true}

// ---------- STATE ----------
const P={x:S.x,y:S.y,tx:S.x,ty:S.y,act:null,face:1,walk:0,moving:false,soak:false};
let bugs=[],parts=[],busy=false,talking=null,bugTimer=0,time=0;
const FLOWERS=[];(function(){let s=7;const r=()=>(s=(s*16807)%2147483647)/2147483647;for(let i=0;i<140;i++){const x=150+r()*1100,y=150+r()*830;if(norm(x,y,GRX,GRY)<.93&&dist(x,y,HOUSE.x,HOUSE.y-30)>80&&dist(x,y,SHOP.x,SHOP.y-30)>80&&dist(x,y,SPRING.x,SPRING.y)>115)FLOWERS.push({x,y,c:['#ff7fbf','#ffffff','#ffb3d9','#ff4f9e','#fff27a'][Math.floor(r()*5)],g:r()<.4})}})();
// what the world shows: our island, or the host's island while visiting (read-only)
const ISL=()=>ONV()?MP.island:S;
const presList=()=>ONV()?MP.island.presents:S.presents, fpList=()=>ONV()?MP.island.fp:S.fpresents;

function addItem(id,n=1){S.bag[id]=(S.bag[id]||0)+n;if(ITEMS[id].k==='fruit')for(let i=0;i<n;i++)S.stack.push(id);const first=!S.found[id];S.found[id]=1;return first}
function takeItem(id,n=1){if((S.bag[id]||0)<n)return false;if(ITEMS[id].k==='fruit')for(let i=0;i<n;i++){const j=S.stack.lastIndexOf(id);if(j>=0)S.stack.splice(j,1)}S.bag[id]-=n;if(S.bag[id]<=0)delete S.bag[id];return true}
function hud(){$('#coins').textContent='🪙 '+S.coins;$('#daypill').textContent=ONV()?'✈️ Visiting':'☀️ Day '+S.day}
let toastT;function toast(t,ms=2200){const e=$('#toast');e.innerHTML=t;e.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('show'),ms)}
function burst(x,y,e,n=6){for(let i=0;i<n;i++)parts.push({x,y,e,vx:rnd(-60,60),vy:rnd(-160,-80),life:1.2})}

// sound
let AC;function beep(notes){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();let t=AC.currentTime;notes.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d);t+=d*.8})}catch(e){}}
const SND={yay:()=>beep([[660,.12],[880,.12],[1175,.25]]),pop:()=>beep([[520,.08],[780,.12]]),oops:()=>beep([[400,.15],[300,.25]]),coin:()=>beep([[988,.08],[1319,.2]])};

// ---------- DAYS ----------
function todayKey(){const d=new Date();return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()}
function beachAngle(){let a;for(let i=0;i<30;i++){a=rnd(0,Math.PI*2);const d=Math.abs(((a-DA)%(Math.PI*2)+Math.PI*3)%(Math.PI*2)-Math.PI);if(d>.38)break}return a}
function randomReq(){const r=Math.random();if(r<.5)return pick(['orange','yuzu']);if(r<.75)return pick(['butterfly','ladybug','caterpillar','snail','ant','cricket','bee']);return pick(['fish','tropical','crab','shrimp'])}
function newDay(force){if(VIS())return false;const k=todayKey();if(!force&&S.dayKey===k)return false;let missed=1;if(S.dayKey&&!force)missed=Math.max(1,Math.round((new Date(k)-new Date(S.dayKey))/864e5));
 S.dayKey=k;S.day++;S.trees=TREES.map(()=>3);S.yuzu=0;
 NEIGH.forEach(n=>{const s=S.neigh[n.id];s.req=randomReq();s.done=false;s.talked=false});
 const pool=BUYABLE.slice().sort(()=>Math.random()-.5);S.stock=pool.slice(0,4);
 const add=Math.min(3-S.presents.length,Math.min(missed,3));for(let i=0;i<add;i++)S.presents.push(beachAngle());
 // presents friends left while visiting yesterday arrive on the beach today
 if(S.giftsPending.length){S.giftsPending.forEach(g=>S.fpresents.push({a:beachAngle(),from:g.from,c:g.c,item:g.item}));S.giftsPending=[];S.fpresents=S.fpresents.slice(-12)}
 bugs=[];for(let i=0;i<4;i++)spawnBug();save();return true}

// ---------- BUGS ----------
function grassSpot(){for(let i=0;i<50;i++){const x=rnd(180,1220),y=rnd(170,960);if(norm(x,y,GRX,GRY)<.85&&dist(x,y,HOUSE.x,HOUSE.y-40)>90&&dist(x,y,SHOP.x,SHOP.y-40)>90&&dist(x,y,SPRING.x,SPRING.y)>110)return{x,y}}return{x:700,y:600}}
function spawnBug(){const t=weighted('bug'),p=grassSpot();bugs.push({t,x:p.x,y:p.y,vx:0,vy:0,ch:0,flee:0,ph:rnd(0,6)})}

// ---------- INPUT ----------
const cam={x:P.x,y:P.y};
function toWorld(sx,sy){return{x:(sx-W/2)/SCALE+cam.x,y:(sy-H/2)/SCALE+cam.y}}
cv.addEventListener('pointerdown',ev=>{if(busy)return;$('#emobar').classList.add('hidden');if(talking){closeTalk();}if(P.soak)leaveSpring();const w=toWorld(ev.clientX,ev.clientY);tapWorld(w.x,w.y)});
function dockHit(x,y){return dist(x,y,SIGN.x,SIGN.y-30)<42||(Math.abs(x-PIER.x)<26&&y>PIER.y-14&&y<PIER.y+PIER.len)||(Math.abs(x-PLANE.x)<62&&Math.abs(y-(PLANE.y-26))<36)}
function tapWorld(x,y){
 for(const b of bugs)if(dist(x,y,b.x,b.y-10)<34){P.act={k:'bug',b};return}
 const pl=presList();for(let i=0;i<pl.length;i++){const p=posAt(pl[i]);if(dist(x,y,p.x,p.y-12)<34){P.act={k:'present',i};setT(p.x,p.y+8);return}}
 const fl=fpList();for(let i=0;i<fl.length;i++){const p=posAt(fl[i].a);if(dist(x,y,p.x,p.y-12)<34){P.act={k:'fpresent',i};setT(p.x,p.y+8);return}}
 for(const n of NEIGH)if(dist(x,y,n.x,n.y-22)<38){P.act={k:'talk',n};return}
 if(dockHit(x,y)){P.act={k:'dock'};setT(DOCK.x,DOCK.y);return}
 {const sx=(x-SPRING.x)/(SPRING.rx+30),sy=(y-SPRING.y)/(SPRING.ry+26);if(sx*sx+sy*sy<1){P.act={k:'spring'};setT(SPRING.x-SPRING.rx-16,SPRING.y+6);return}}
 for(let i=0;i<TREES.length;i++){const t=TREES[i];if(dist(x,y,t.x,t.y-58)<48||dist(x,y,t.x,t.y-15)<22){P.act={k:'tree',i};setT(t.x+(P.x<t.x?-34:34),t.y+6);return}}
 if(Math.abs(x-HOUSE.x)<66&&y<HOUSE.y+6&&y>HOUSE.y-135){P.act={k:'house'};setT(HOUSE.x,HOUSE.y+22);return}
 if(Math.abs(x-SHOP.x)<66&&y<SHOP.y+6&&y>SHOP.y-130){P.act={k:'shop'};setT(SHOP.x,SHOP.y+22);return}
 if(norm(x,y,SRX,SRY)>1){const e=edge(angleOf(x,y),SRX,SRY,.94);P.act={k:'fish'};setT(e.x,e.y);return}
 P.act=null;setT(x,y)}
function setT(x,y){if(norm(x,y,SRX,SRY)>.95){const e=edge(angleOf(x,y),SRX,SRY,.95);x=e.x;y=e.y}P.tx=x;P.ty=y}
function posAt(a){return edge(a,(SRX+GRX)/2+6,(SRY+GRY)/2+6,1)}
function presentPos(i){return posAt(S.presents[i])}

// ---------- UPDATE ----------
function update(dt){time+=dt;
 const a=P.act;
 if(a&&a.k==='bug'){if(!bugs.includes(a.b)){P.act=null}else{P.tx=a.b.x+(P.x<a.b.x?-26:26);P.ty=a.b.y+4;if(dist(P.x,P.y,a.b.x,a.b.y)<48){catchBug(a.b);P.act=null}}}
 else if(a&&a.k==='talk'){P.tx=a.n.x+(P.x<a.n.x?-46:46);P.ty=a.n.y+2;if(dist(P.x,P.y,a.n.x,a.n.y)<58){P.act=null;P.tx=P.x;P.ty=P.y;openTalk(a.n)}}
 const dx=P.tx-P.x,dy=P.ty-P.y,d=Math.hypot(dx,dy),sp=175;
 if(d>3){const s=Math.min(d,sp*dt);P.x+=dx/d*s;P.y+=dy/d*s;P.walk+=dt*12;P.moving=true;if(Math.abs(dx)>2)P.face=dx>0?1:-1}
 else{P.moving=false;if(a&&!['bug','talk'].includes(a.k)){P.act=null;doAct(a)}}
 const vis=ONV();
 NEIGH.forEach((n,i)=>{if(vis){const k=Math.min(1,dt*8);n.x+=(n.tx-n.x)*k;n.y+=(n.ty-n.y)*k;return}
  if(talking===n){n.face=P.x>n.x?1:-1;return}const joins=P.soak&&S.neigh[n.id].f>=3;
  if(joins){n.tx=SOAK[i].x;n.ty=SOAK[i].y}else if(n.soak){n.soak=false;n.tx=n.hx;n.ty=n.hy;n.wait=rnd(1,3)}
  const ddx=n.tx-n.x,ddy=n.ty-n.y,dd=Math.hypot(ddx,ddy);if(dd>2){const s=Math.min(dd,(joins?70:38)*dt);n.x+=ddx/dd*s;n.y+=ddy/dd*s;if(Math.abs(ddx)>1)n.face=ddx>0?1:-1}else if(joins){n.soak=true;n.face=-1}else if((n.wait-=dt)<0){n.wait=rnd(2,6);n.tx=n.hx+rnd(-80,80);n.ty=n.hy+rnd(-50,50)}});
 if(!vis&&!VIS()&&P.soak&&S.soakDay!==S.dayKey){const want=NEIGH.filter(n=>S.neigh[n.id].f>=3),inn=want.filter(n=>n.soak);if(want.length&&inn.length===want.length){S.soakDay=S.dayKey;inn.forEach(n=>friend(n,1));SND.yay();openSpring(`Ahhh... ♨️ ${inn.map(n=>n.n).join(' and ')} came to soak with you! 💕 What a happy day!`);save()}}
 bugs.forEach(b=>{const it=ITEMS[b.t];b.ph+=dt;if((b.ch-=dt)<0){b.ch=rnd(1,3);const sp=it.fly?40:12,ang=rnd(0,6.28);b.vx=Math.cos(ang)*sp;b.vy=Math.sin(ang)*sp}
  if(b.flee>0){b.flee-=dt;const ex=b.x-P.x,ey=b.y-P.y,el=Math.hypot(ex,ey)||1;b.vx=ex/el*110;b.vy=ey/el*110}
  const nx=b.x+b.vx*dt,ny=b.y+b.vy*dt;if(norm(nx,ny,GRX,GRY)<.9){b.x=nx;b.y=ny}else{b.vx*=-1;b.vy*=-1}});
 if(!VIS()&&(bugTimer-=dt)<0){bugTimer=10;if(bugs.length<5)spawnBug()}
 TREES.forEach(t=>t.shake=Math.max(0,t.shake-dt));
 parts=parts.filter(p=>(p.life-=dt)>0);parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=260*dt});
 mpUpdate(dt);
 cam.x+=(P.x-cam.x)*Math.min(1,dt*6);cam.y+=(P.y-40+(talking?120/SCALE:0)-cam.y)*Math.min(1,dt*6);
 const hw=W/2/SCALE,hh=H/2/SCALE;cam.x=Math.max(hw-60,Math.min(1460-hw,cam.x));cam.y=Math.max(hh-60,Math.min(1180-hh,cam.y));
}

// ---------- ACTIONS ----------
function hostName(){return esc(MP.island?MP.island.name:'')}
function doAct(a){const vis=ONV();
 if(a.k==='tree'){const t=TREES[a.i];t.shake=.6;if(vis){toast(`Those are ${hostName()}'s ${t.f==='orange'?'oranges':'yuzu'}! ${ITEMS[t.f].e}<br>You can pick fruit on your own island.`);return}
  const n=S.trees[a.i];if(n>0){S.trees[a.i]=0;const first=addItem(t.f,n);burst(t.x,t.y-60,ITEMS[t.f].e,n+2);SND.pop();const h=S.stack.length;toast(`You picked ${n} ${ITEMS[t.f].n}! ${ITEMS[t.f].e}`+(first?'<br>✨ New in your book!':'')+(h>=12?`<br>WOW! ${h} fruit on your head! 🤣`:h>=6?`<br>You're balancing ${h} fruit on your head! 😆`:''));save()}else toast('No fruit left. It will grow back tomorrow! 🌙')}
 else if(a.k==='present'){if(vis){toast(`That present is for ${hostName()}! 🎁`);return}if(a.i>=S.presents.length)return;const p=presentPos(a.i);S.presents.splice(a.i,1);openPresent(p);save()}
 else if(a.k==='fpresent'){if(vis){toast(`That present is for ${hostName()}! 💝`);return}openFPresent(a.i)}
 else if(a.k==='house'){if(vis){toast(`That's ${hostName()}'s house! 🏠`);return}openHouse()}
 else if(a.k==='shop'){if(vis){toast('Berry says: "Come shopping on your own island!" 🦝');return}openShop()}
 else if(a.k==='fish'){if(vis){toast('No fishing on a visit.<br>You can fish at home! 🎣');return}startFish()}
 else if(a.k==='spring')enterSpring();
 else if(a.k==='dock')openDock();
}
function catchBug(b){const it=ITEMS[b.t];if(Math.random()<.85){bugs.splice(bugs.indexOf(b),1);const first=addItem(b.t);burst(b.x,b.y,'✨',6);SND.yay();toast(`You caught a ${it.n}! ${it.e}`+(first?'<br>✨ New in your book!':''));save()}else{b.flee=1.2;SND.oops();toast(`Oh no, the ${it.n} got away! Try again!`)}}
function openPresent(p){SND.yay();burst(p.x,p.y,'🎉',8);if(Math.random()<.55){const c=pick([100,150,200,250,300]);S.coins+=c;hud();modal(`<h2>🎁 A present!</h2><div style="text-align:center;font-size:60px">🪙</div><p style="text-align:center;font-size:20px;font-weight:800">It was full of coins!<br>+${c} coins</p><div class="row"><button class="btn" onclick="closeModal()">Yay!</button></div>`)}
 else{const id=Math.random()<.4?pick(PRESENT_ONLY):pick(BUYABLE);const first=addItem(id);modal(`<h2>🎁 A present!</h2><div style="text-align:center;font-size:70px">${ITEMS[id].e}</div><p style="text-align:center;font-size:20px;font-weight:800">You got a ${ITEMS[id].n}!${first?'<br>✨ New in your book!':''}</p><p style="text-align:center">Put it in your house! 🏠</p><div class="row"><button class="btn" onclick="closeModal()">Yay!</button></div>`)}}
function openFPresent(i){const p=S.fpresents[i];if(!p)return;S.fpresents.splice(i,1);const id=ITEMS[p.item]&&ITEMS[p.item].k==='furn'?p.item:pick(GIFT_POOL),first=addItem(id),pp=posAt(p.a);SND.yay();burst(pp.x,pp.y,'💝',8);save();
 modal(`<h2>🎁 From ${esc(p.from)}!</h2><div style="text-align:center;font-size:70px">${ITEMS[id].e}</div><p style="text-align:center;font-size:20px;font-weight:800">Your friend ${esc(p.from)} left you a ${ITEMS[id].n}!${first?'<br>✨ New in your book!':''}</p><p style="text-align:center">Put it in your house! 🏠</p><div class="row"><button class="btn" onclick="closeModal()">Yay! 💕</button></div>`)}

// ---------- TALK ----------
function hearts(f){const full=Math.floor(f/2);let s='';for(let i=0;i<5;i++)s+=i<full?'💗':'🤍';return s}
function openTalk(n,override){
 if(VIS()){talking=n;const T=$('#talk');T.classList.remove('hidden');T.querySelector('.tn').textContent=n.e+' '+n.n;T.querySelector('.tt').innerHTML=pick([`Hi ${esc(S.name)}! Welcome to ${hostName()}'s island! 🌸`,`Yay, a visitor! Hi ${esc(S.name)}! 💕`].concat(n.lines));T.querySelector('.th').textContent='';const row=T.querySelector('.row');row.innerHTML='';const bye=document.createElement('button');bye.className='btn white';bye.textContent='Bye! 👋';bye.onclick=closeTalk;row.appendChild(bye);return}
 talking=n;const s=S.neigh[n.id];if(!s.talked){s.talked=true;friend(n,1)}
 const T=$('#talk');T.classList.remove('hidden');T.querySelector('.tn').textContent=n.e+' '+n.n;const row=T.querySelector('.row');row.innerHTML='';
 let text=override;
 if(!text){if(!s.done&&s.req){const it=ITEMS[s.req];text=`Hi ${esc(S.name)}! Could you bring me ${it.k==='fruit'?'some':'a'} ${it.n} ${it.e}? That would make me so happy!`}else text=pick(n.lines)}
 T.querySelector('.tt').innerHTML=text;T.querySelector('.th').textContent='Friendship '+hearts(s.f);
 if(!s.done&&s.req&&S.bag[s.req]&&!override){const b=document.createElement('button');b.className='btn';b.textContent='Give '+ITEMS[s.req].e;b.onclick=()=>give(n);row.appendChild(b)}
 const bye=document.createElement('button');bye.className='btn white';bye.textContent='Bye! 👋';bye.onclick=closeTalk;row.appendChild(bye);save()}
function closeTalk(){talking=null;$('#talk').classList.add('hidden')}
function friend(n,v){const s=S.neigh[n.id];s.f=Math.min(10,s.f+v);burst(n.x,n.y-40,'💗',4)}
function give(n){const s=S.neigh[n.id];if(!takeItem(s.req))return;s.done=true;S.coins+=150;hud();friend(n,2);SND.coin();
 let msg=`Thank you, ${esc(S.name)}!! 💕 Here are 150 coins!`;
 const thr=[4,10];thr.forEach((t,i)=>{const g=n.gifts[i];if(s.f>=t&&!s.g.includes(g)){s.g.push(g);addItem(g);msg+=`<br>And I made you a present because we're friends: ${ITEMS[g].n} ${ITEMS[g].e}!`;SND.yay()}});
 openTalk(n,msg)}

// ---------- HOT SPRING ----------
function enterSpring(){P.soak=true;if(ONV()){const v=pick(VSOAK);P.x=v.x;P.y=v.y}else{P.x=SPRING.x-28;P.y=SPRING.y+4}P.tx=P.x;P.ty=P.y;P.face=1;SND.pop();burst(P.x,P.y-20,'💦',5);openSpring()}
function leaveSpring(){P.soak=false;P.x=SPRING.x-SPRING.rx-16;P.y=SPRING.y+6;P.tx=P.x;P.ty=P.y}
function openSpring(msg){talking='spring';const T=$('#talk');T.classList.remove('hidden');T.querySelector('.tn').textContent='♨️ Hot Spring';const row=T.querySelector('.row');row.innerHTML='';
 const add=(t,f,c)=>{const b=document.createElement('button');b.className='btn'+(c?' '+c:'');b.textContent=t;b.onclick=f;row.appendChild(b)};
 if(ONV()){T.querySelector('.tt').innerHTML=`Ahhh... so warm! ♨️ ${hostName()}'s hot spring is the best!`;T.querySelector('.th').textContent='';add('Get out',()=>{closeTalk();leaveSpring()},'white');return}
 const fr=NEIGH.filter(n=>S.neigh[n.id].f>=3);
 T.querySelector('.tt').innerHTML=msg||(fr.length?`Ahhh... so warm! ${fr.map(n=>n.e+' '+n.n).join(' and ')} ${fr.length>1?'are':'is'} coming to soak with you!`:`Ahhh... so warm! ♨️ Help your friends, and they'll come soak with you.`);
 T.querySelector('.th').textContent=S.yuzu?`🍋 ${S.yuzu} yuzu floating in the water`:'';
 if(S.bag.yuzu)add('Toss in a yuzu 🍋',tossYuzu);add('Decorate 🏮',decoSpring);add('Get out',()=>{closeTalk();leaveSpring()},'white')}
function tossYuzu(){if(VIS()||!takeItem('yuzu'))return;S.yuzu++;SND.pop();burst(SPRING.x,SPRING.y-10,'💛',4);save();openSpring(pick(['Plop! Now the water smells like yuzu! 🍋','Plop! A cozy yuzu bath! 💛','Splash! Another yuzu for the spring!']))}
function decoSpring(){if(VIS())return;modal(`<h2>♨️ Decorate the Hot Spring</h2><p style="text-align:center">Tap a spot to put something there. Tap it again to put it away.</p><div class="grid" style="grid-template-columns:repeat(3,1fr)">${S.spring.map((id,i)=>id?`<div class="cell" onclick="springSlot(${i})">${ITEMS[id].e}<small>${ITEMS[id].n}</small></div>`:`<div class="cell unk" onclick="springSlot(${i})">+</div>`).join('')}</div><div class="row"><button class="btn" onclick="closeModal();if(P.soak)openSpring()">Done</button></div>`)}
window.springSlot=i=>{if(VIS())return;const id=S.spring[i];if(id){S.spring[i]=null;addItem(id);SND.pop();save();decoSpring();return}
 const fk=Object.keys(S.bag).filter(k=>ITEMS[k].k==='furn');if(!fk.length){toast('No furniture in your bag yet! Try the shop 🦝');return}
 modal(`<h2>What goes here?</h2><div class="grid">${fk.map(k=>`<div class="cell" onclick="placeSpring(${i},'${k}')">${ITEMS[k].e}<small>${ITEMS[k].n}</small><span class="cnt">${S.bag[k]}</span></div>`).join('')}</div><div class="row"><button class="btn white" onclick="decoSpring()">Back</button></div>`)};
window.placeSpring=(i,k)=>{if(VIS()||!takeItem(k))return;S.spring[i]=k;SND.pop();save();decoSpring()};

// ---------- FISHING ----------
let F=null;
function startFish(){if(VIS())return;busy=true;closeTalk();$('#fish').classList.remove('hidden');fishWait()}
function fishWait(){clearTimeout(F&&F.t);F={st:'wait'};$('#fmsg').textContent='Wait for the fish to bite...';$('#fbtn').classList.remove('bite');$('#bobber').style.transform='translate(-50%,-50%)';
 const nib=()=>{if(!F||F.st!=='wait')return;$('#bobber').style.transform='translate(-50%,-40%)';setTimeout(()=>{if(F&&F.st==='wait')$('#bobber').style.transform='translate(-50%,-50%)'},150)};

 if(view==='guestbook'){const gb=S.guestbook;h+=`<h3>📝 My Guestbook</h3>`+(gb.length?'<div class="list">'+gb.slice().reverse().map(g=>`<div class="li"><span class="e">${esc(g.s)}</span><span class="t"><span class="dot" style="background:${(CAPY[g.c]||CAPY.caramel).b}"></span>${esc(g.n)}<small>visited on ${esc(g.d)}</small></span></div>`).join('')+'</div>':'<p class="note">No visitors yet!<br>Open your island and share your code with a friend. ✈️</p>')+`<div class="row"><button class="btn white" onclick="openDock()">Back</button><button class="btn" onclick="closeModal()">Close</button></div>`}
 else if(MP.role==='visitor'){
  if(view==='stamp')h+=`<p class="c">Pick a stamp for ${hn}'s guestbook!</p><div class="grid" style="grid-template-columns:repeat(3,1fr)">${STAMPS.map((s,i)=>`<div class="cell" style="font-size:44px" onclick="mpSign(${i})">${s}</div>`).join('')}</div><div class="row"><button class="btn white" onclick="openDock()">Back</button></div>`;
  else if(view==='wrap')h+=`<p class="c">Pick a wrapping color! 🎀<br><small>A surprise will be inside. It will be on ${hn}'s beach tomorrow.</small></p><div class="grid" style="grid-template-columns:repeat(3,1fr)">${Object.keys(WRAPS).map(k=>`<div class="cell" style="background:${WRAPS[k]};border-color:#fff;font-size:34px" onclick="mpGift('${k}')">🎀</div>`).join('')}</div><div class="row"><button class="btn white" onclick="openDock()">Back</button></div>`;
  else h+=`<p class="c">You're visiting <b>${hn}</b>'s island! 🏝️</p><button class="btn big" ${MP.signed?'disabled':''} onclick="openDock('stamp')">${MP.signed?'Guestbook signed ✓':'Sign the guestbook 📝'}</button><button class="btn big" ${MP.gave?'disabled':''} onclick="openDock('wrap')">${MP.gave?'Present left ✓':'Leave a present 🎁'}</button><button class="btn big white" onclick="leaveIsland()">Fly home ✈️</button><div class="row"><button class="btn white" onclick="closeModal()">Keep playing</button></div>`}
 else if(view==='visit'){if(MP.role==='host'){view='main';return openDock()}
  h+=`<p class="c">Type your friend's island code:</p><input class="code" id="vcode" maxlength="5" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" placeholder="?????" value="${esc(prefill||'')}"><p class="c" style="font-size:14px">You'll fly there as <span class="dot" style="background:${CAPY[S.vcolor].b}"></span>${esc(S.name)}</p>`+(peerOK()?'':`<p class="note">${OFFLINE_MSG}</p>`)+`<div class="row"><button class="btn" id="vgo" style="font-size:22px" onclick="visitFriend(document.getElementById('vcode').value)" ${peerOK()?'':'disabled'}>Fly! ✈️</button><button class="btn white" onclick="openDock()">Back</button></div>`}
 else if(MP.role==='host'){
  if(MP.hostState!=='open')h+=`<p class="c" style="font-size:18px">Opening your island...</p><div style="text-align:center;font-size:56px"><div class="fly">🛬</div></div><div class="row"><button class="btn white" onclick="closeIsland()">Cancel</button></div>`;
  else{h+=`<p class="c">Your island is open! 🏝️ Tell your friend this code:</p><div class="code">${MP.code}</div><div class="row"><button class="btn" onclick="copyCode()">Copy 📋</button>${navigator.share?'<button class="btn" onclick="shareCode()">Share 💌</button>':''}</div>
   <h3>Visitors (${MP.vis.size}/${MAX_VIS})</h3>`+(MP.vis.size?'<div class="list">'+[...MP.vis.values()].map(v=>`<div class="li"><span class="t"><span class="dot" style="background:${CAPY[v.color].b}"></span>${esc(v.name)}</span><button class="btn white" onclick="sendHome('${esc(v.id)}')">Send home 🏠</button></div>`).join('')+'</div>':'<p class="note" style="margin-top:0">Waiting for friends to fly in... ✈️</p>')+
   `<div class="row"><button class="btn white" onclick="openDock('guestbook')">📝 Guestbook (${S.guestbook.length})</button><button class="btn white" onclick="closeIsland()">Close my island 🔒</button></div><div class="row"><button class="btn" onclick="closeModal()">Keep playing</button></div>`}}
 else{h+=`<p class="c">Visit a friend's island, or invite friends to yours!</p>`+(peerOK()?'':`<p class="note">${OFFLINE_MSG}</p>`)+
  `<button class="btn big" ${peerOK()?'':'disabled'} onclick="openIsland()">Open my island 🏝️</button><button class="btn big" ${peerOK()?'':'disabled'} onclick="openDock('visit')">Visit a friend ✈️</button>
  <h3>My visiting color</h3><div class="sws">${Object.keys(CAPY).filter(k=>k!=='pink').concat('pink').map(k=>`<button class="sw ${S.vcolor===k?'on':''}" title="${CAPY[k].n}" style="background:${CAPY[k].b}" onclick="setVColor('${k}')"></button>`).join('')}</div><p class="c" style="font-size:13px;margin:6px 0 0">When you visit, you'll be a ${CAPY[S.vcolor].n.toLowerCase()} capybara!</p>
  <div class="row"><button class="btn white" onclick="openDock('guestbook')">📝 Guestbook (${S.guestbook.length})</button><button class="btn white" onclick="closeModal()">Bye! 👋</button></div>`}
 modal(h);MP.dockOpen=true;MP.dockView=view;
 const inp=$('#vcode');if(inp){inp.oninput=()=>{const v=inp.value.toUpperCase().replace(/[^A-Z0-9]/g,'').split('').filter(ch=>CODE_ABC.includes(ch)).join('').slice(0,5);if(v!==inp.value)inp.value=v};inp.onkeydown=e=>{if(e.key==='Enter')visitFriend(inp.value)};setTimeout(()=>{try{inp.focus()}catch(e){}},50)}};

// ---------- GROWN-UPS: backup & restore (press and hold the gear) ----------
let restoring=false;
(function(){const g=$('#gear');let t=null;const cancel=()=>{clearTimeout(t);t=null;g.classList.remove('hold')};
 g.addEventListener('pointerdown',e=>{e.preventDefault();if(busy&&!MP.dockOpen&&$('#modal').classList.contains('hidden'))return;g.classList.add('hold');clearTimeout(t);t=setTimeout(()=>{cancel();grownups()},1500)});
 ['pointerup','pointerleave','pointercancel'].forEach(ev=>g.addEventListener(ev,()=>{if(t){cancel();toast('For grown-ups: press and hold ⚙️')}}));
 g.addEventListener('contextmenu',e=>e.preventDefault())})();
function backupObj(){save();return{app:'capy-island',v:1,key:KEY,date:new Date().toISOString(),save:JSON.parse(JSON.stringify(S))}}
const b64enc=s=>btoa(unescape(encodeURIComponent(s))),b64dec=s=>decodeURIComponent(escape(atob(s)));
function backupName(){const d=new Date(),z=n=>String(n).padStart(2,'0');return`capy-island-backup-${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}.json`}
function grownups(msg){modal(`<h2>⚙️ Grown-ups</h2>${msg?`<p class="note">${msg}</p>`:''}<p class="c" style="font-size:14px">Save a backup of ${esc(S.name||'the')}'s island so it can't get lost (Chrome can clear website data).</p>
 <button class="btn big" onclick="saveBackup()">💾 Save backup file</button><button class="btn big white" onclick="copyBackup()">📋 Copy backup code</button><div id="bkcode"></div>
 <h3>Restore a backup</h3><div class="row" style="margin-top:0"><label class="btn white">📂 Choose file<input type="file" id="bkfile" accept=".json,application/json,text/plain" style="display:none"></label></div>
 <p class="c" style="font-size:14px;margin:10px 0 4px">…or paste a backup code:</p><textarea class="bk" id="bkpaste" placeholder="Paste backup code here"></textarea><div class="row"><button class="btn white" onclick="restoreText(document.getElementById('bkpaste').value)">Restore from code</button></div>
 <p class="c" style="font-size:12px;color:#b0487c">Capy Island v3 · save key ${KEY}</p><div class="row"><button class="btn" onclick="closeModal()">Close</button></div>`);
 $('#bkfile').onchange=e=>{const f=e.target.files&&e.target.files[0];if(!f)return;if(f.size>2e6){grownups('😕 That file is too big to be a Capy Island backup.');return}const r=new FileReader();r.onload=()=>restoreText(String(r.result));r.onerror=()=>grownups("😕 Couldn't read that file.");r.readAsText(f)}}
window.saveBackup=async()=>{const json=JSON.stringify(backupObj(),null,1),name=backupName();
 try{const file=new File([json],name,{type:'application/json'});if(navigator.canShare&&navigator.share&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Capy Island backup',text:`Capy Island backup (${new Date().toLocaleDateString()})`});toast('Backup shared! 💾');return}}catch(e){if(e&&e.name==='AbortError')return}
 const url=URL.createObjectURL(new Blob([json],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);toast('Backup downloaded! 💾<br>'+name,3500)};
window.copyBackup=()=>{const code='CAPY1:'+b64enc(JSON.stringify(backupObj()));const box=$('#bkcode');if(box){box.innerHTML='<p class="c" style="font-size:13px;margin:8px 0 4px">Backup code (keep it somewhere safe):</p><textarea class="bk" readonly id="bkout"></textarea>';$('#bkout').value=code}
 const ok=()=>toast('Backup code copied! 📋'),no=()=>{toast('Select the code and copy it 📋');try{$('#bkout').select()}catch(e){}};try{navigator.clipboard.writeText(code).then(ok,no)}catch(e){no()}};
function parseBackup(txt){txt=String(txt||'').trim();if(!txt)throw 0;let o;
 if(txt[0]!=='{'){const c=txt.replace(/^CAPY1:/,'').replace(/\s+/g,'');o=JSON.parse(b64dec(c))}else o=JSON.parse(txt);
 let sv=o&&o.app==='capy-island'?o.save:o;const date=o&&o.date?new Date(o.date):null;
 const obj=v=>v&&typeof v==='object'&&!Array.isArray(v);
 if(!obj(sv)||!obj(sv.neigh)||!obj(sv.bag)||typeof sv.coins!=='number'||typeof sv.name!=='string'||(sv.room&&!Array.isArray(sv.room))||(sv.trees&&!Array.isArray(sv.trees)))throw 0;
 for(const k in sv.bag)if(!ITEMS[k]||typeof sv.bag[k]!=='number')throw 0;
 return{save:sv,date:date&&!isNaN(date)?date:null}}
window.restoreText=txt=>{let b;try{b=parseBackup(txt)}catch(e){grownups("😕 That doesn't look like a Capy Island backup.<br>Nothing was changed.");return}
 if(MP.role){grownups('Please finish visiting / close your island first. ✈️');return}
 window._pendingRestore=b;const when=b.date?b.date.toLocaleString():'an unknown date';
 modal(`<h2>⚙️ Restore backup?</h2><p class="c" style="font-size:17px">This will replace the current island with the backup from <b>${esc(when)}</b>${b.save.name?` (${esc(b.save.name)}'s island, 🪙 ${b.save.coins|0})`:''}.<br><br>Continue?</p><div class="row"><button class="btn" onclick="doRestore()">Yes, restore</button><button class="btn white" onclick="grownups()">Cancel</button></div>`)};
window.doRestore=()=>{const b=window._pendingRestore;if(!b)return;restoring=true;try{localStorage.setItem(KEY,JSON.stringify(b.save))}catch(e){restoring=false;grownups("😕 Couldn't save the backup on this phone.");return}location.replace(location.pathname)};
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persisted().then(p=>p||navigator.storage.persist()).catch(()=>{})}catch(e){}

// ---------- START ----------
islReady=true;buildIsland();
const QS=new URLSearchParams(location.search);let pendingVisit=(QS.get('visit')||'').toUpperCase();if(!/^[A-Z0-9]{5}$/.test(pendingVisit)||[...pendingVisit].some(c=>!CODE_ABC.includes(c)))pendingVisit='';
if(QS.has('visit'))try{QS.delete('visit');history.replaceState(null,'',location.pathname+(QS.toString()?'?'+QS:'')+location.hash)}catch(e){}
function maybeVisit(){if(pendingVisit){const c=pendingVisit;pendingVisit='';setTimeout(()=>openDock('visit',c),700)}}
function welcome(){modal(`<h2>🌸 Welcome to Capy Island! 🌸</h2><div style="text-align:center;font-size:54px">🏝️</div><p style="text-align:center;font-weight:700">You're a little pink capybara with your very own island! What's your name?</p><input class="name" id="nm" maxlength="12" value="Emi"><p style="font-size:15px;line-height:1.5">👆 Tap anywhere to walk.<br>🍊 Tap trees to pick fruit. It stacks on your head!<br>🦋 Tap bugs to catch them.<br>🌊 Tap the water to go fishing.<br>🐰 Tap your friends to say hi!<br>♨️ Tap the hot spring to relax.<br>✈️ Tap the seaplane to visit friends!</p><div class="row"><button class="btn" id="go">Let's play! 🩷</button></div>`);
 $('#go').onclick=()=>{S.name=($('#nm').value.trim()||'Emi').slice(0,12);closeModal();newDay(true);hud();save();toast('Look! There are presents on the beach! 🎁',3500);maybeVisit()}}
if(QS.has('newday')){S.dayKey='';}
hud();
if(!S.name)welcome();
else{if(newDay()){hud();setTimeout(()=>toast(`Good morning, ${esc(S.name)}! 🌞<br>The fruit grew back and your friends need help!`+(S.fpresents.length?'<br>💝 A friend left you a present on the beach!':''),4000),300)}else{for(let i=0;i<4;i++)spawnBug()}maybeVisit()}
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else if(S.name&&!VIS()&&newDay()){hud();toast(`Good morning, ${esc(S.name)}! 🌞 A new day on Capy Island!`,3500)}});
addEventListener('pagehide',()=>{if(MP.role==='visitor')try{MP.conn&&MP.conn.send({t:'bye'})}catch(e){}if(MP.role==='host')try{broadcast({t:'closed'})}catch(e){}});
setInterval(save,5000);
requestAnimationFrame(loop);
</script>
</body>
</html>
